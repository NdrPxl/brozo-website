<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monarch Pad — Launch coins on Arc</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg:#05080c;
  --bg-elevated:#0a1017;
  --surface:#0e161d;
  --surface-2:#121c25;
  --border:#1c2a34;
  --border-soft:#141f28;
  --text:#eaf2f5;
  --text-dim:#a9b8c2;
  --text-mute:#69808d;
  --teal:#00e6c3;
  --blue:#4a7fff;
  --grad:linear-gradient(115deg,#00e6c3 0%,#3d8bff 100%);
  --grad-soft:linear-gradient(115deg,rgba(0,230,195,.14) 0%,rgba(61,139,255,.14) 100%);
  --pos:#1fe6a8;
  --neg:#ff6b81;
  --gold:#ffc164;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;}
body{min-height:100vh;overflow-x:hidden;}
h1,h2,h3,.disp{font-family:'Space Grotesk',system-ui,sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
::selection{background:rgba(0,230,195,.3);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#1c2a34;border-radius:8px;}

/* ---------- background arc motif ---------- */
.bg-arcs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.bg-arcs svg{position:absolute;top:-10%;right:-15%;width:900px;max-width:70vw;opacity:.55;}

#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}

header{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;
  background:rgba(5,8,12,.78);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft);
}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--grad);position:relative;flex-shrink:0;}
.brand-mark::after{content:"";position:absolute;inset:6px;border:2px solid var(--bg);border-radius:50%;border-right-color:transparent;transform:rotate(-45deg);}
.brand-name{font-weight:700;font-size:19px;letter-spacing:-.02em;font-family:'Space Grotesk',sans-serif;}
.brand-name span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.brand-tag{font-size:10.5px;color:var(--text-mute);border:1px solid var(--border);padding:2px 7px;border-radius:20px;margin-left:2px;letter-spacing:.03em;}

nav.top{display:flex;align-items:center;gap:10px;}
.btn{padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:600;transition:transform .12s ease, opacity .12s ease;}
.btn:active{transform:scale(.96);}
.btn-grad{background:var(--grad);color:#03211c;}
.btn-grad:hover{opacity:.92;}
.btn-outline{border:1px solid var(--border);color:var(--text);background:var(--surface);}
.btn-outline:hover{border-color:#2a3c48;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.wallet-chip{
  display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:7px 12px;font-size:12.5px;
}
.wallet-dot{width:7px;height:7px;border-radius:50%;background:var(--pos);box-shadow:0 0 8px var(--pos);}
.wallet-bal{font-family:'IBM Plex Mono',monospace;font-weight:600;}
.wallet-addr{color:var(--text-mute);font-family:'IBM Plex Mono',monospace;}

main{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:0 28px 80px;}

/* ---------- banner ---------- */
.banner{
  margin-top:20px;padding:11px 16px;border-radius:12px;font-size:13px;
  background:rgba(255,193,100,.08);border:1px solid rgba(255,193,100,.3);color:var(--gold);
}
.banner.grad-banner{background:var(--grad-soft);border-color:rgba(0,230,195,.4);color:var(--text);}

/* ---------- hero ---------- */
.hero{
  position:relative;margin-top:26px;padding:46px 40px;border-radius:22px;overflow:hidden;
  background:radial-gradient(120% 140% at 85% -10%, rgba(61,139,255,.20), transparent 60%),
             radial-gradient(90% 120% at 5% 110%, rgba(0,230,195,.14), transparent 55%),
             var(--bg-elevated);
  border:1px solid var(--border-soft);
}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--teal);background:rgba(0,230,195,.09);border:1px solid rgba(0,230,195,.25);padding:5px 11px;border-radius:20px;margin-bottom:18px;}
.hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero h1{font-size:44px;line-height:1.08;letter-spacing:-.03em;max-width:640px;font-weight:700;}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero p{margin-top:14px;color:var(--text-dim);max-width:520px;font-size:15.5px;line-height:1.55;}
.hero-cta{display:flex;gap:12px;margin-top:26px;}
.hero-cta .btn{padding:12px 20px;font-size:14px;}
.hero-stats{display:flex;gap:34px;margin-top:38px;flex-wrap:wrap;}
.hero-stat b{display:block;font-family:'IBM Plex Mono',monospace;font-size:19px;color:var(--text);}
.hero-stat span{font-size:11.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.04em;}

/* ---------- section headers ---------- */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:44px 0 16px;}
.sec-head h2{font-size:19px;font-weight:600;letter-spacing:-.01em;}
.sec-head .sub{font-size:12.5px;color:var(--text-mute);}

/* ---------- king of the hill ---------- */
.hill{
  display:flex;gap:22px;align-items:center;padding:20px 22px;border-radius:18px;
  background:linear-gradient(100deg, rgba(255,193,100,.10), rgba(0,230,195,.06));
  border:1px solid rgba(255,193,100,.28);cursor:pointer;transition:border-color .15s;
}
.hill:hover{border-color:rgba(255,193,100,.55);}
.hill-icon{width:64px;height:64px;border-radius:16px;flex-shrink:0;font-size:22px;}
.hill-crown{position:absolute;font-size:15px;transform:translate(20px,-38px);}
.hill-mid{flex:1;min-width:0;}
.hill-mid .name-row{display:flex;align-items:center;gap:9px;}
.hill-mid .name-row b{font-size:17px;}
.hill-mid .tick{color:var(--text-mute);font-family:'IBM Plex Mono',monospace;font-size:13px;}
.hill-mid p{color:var(--text-dim);font-size:13px;margin-top:4px;max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hill-prog{width:170px;flex-shrink:0;}
.hill-right{text-align:right;flex-shrink:0;}
.hill-right b{font-size:18px;font-family:'IBM Plex Mono',monospace;}
.hill-right span{display:block;font-size:11.5px;color:var(--text-mute);margin-top:2px;}

.prog-label{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-mute);margin-bottom:5px;}
.prog-track{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;}
.prog-fill{height:100%;background:var(--grad);border-radius:6px;transition:width .5s ease;}

/* ---------- filters ---------- */
.filters{display:flex;gap:8px;margin-bottom:2px;flex-wrap:wrap;}
.chip{padding:7px 14px;border-radius:9px;font-size:12.5px;border:1px solid var(--border);color:var(--text-dim);background:var(--surface);}
.chip.active{background:var(--grad-soft);border-color:rgba(0,230,195,.4);color:var(--teal);}

/* ---------- coin grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px;margin-top:18px;}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;
  transition:transform .15s ease, border-color .15s ease; position:relative; overflow:hidden;
  display:block;cursor:pointer;
}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad);opacity:0;transition:opacity .15s;}
.card:hover{transform:translateY(-3px);}
.card:hover::before{opacity:1;}
.card-top{display:flex;gap:12px;align-items:flex-start;}
.icon{
  width:46px;height:46px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;color:#03211c;position:relative;overflow:hidden;
}
.icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.card-title{min-width:0;flex:1;}
.card-title .n{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-title .t{font-size:12px;color:var(--text-mute);font-family:'IBM Plex Mono',monospace;}
.badge{font-size:10px;font-family:'IBM Plex Mono',monospace;font-weight:600;padding:2px 7px;border-radius:6px;flex-shrink:0;}
.badge.ex{color:var(--gold);background:rgba(255,193,100,.1);border:1px solid rgba(255,193,100,.25);}
.badge.grd{color:var(--teal);background:rgba(0,230,195,.1);border:1px solid rgba(0,230,195,.25);}
.card-desc{font-size:12.5px;color:var(--text-dim);margin-top:11px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px;}
.card-stats{display:flex;justify-content:space-between;margin-top:12px;font-size:11.5px;color:var(--text-mute);}
.card-stats b{color:var(--text);font-family:'IBM Plex Mono',monospace;font-weight:600;}
.card .prog-track{margin-top:10px;}

/* ---------- create page ---------- */
.create-wrap{max-width:520px;margin:30px auto 0;}
.create-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:18px;padding:26px;}
.create-card h3{font-size:19px;margin-bottom:4px;}
.create-card .sub{color:var(--text-mute);font-size:12.5px;margin-bottom:22px;}
.field{margin-bottom:15px;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
.field input,.field textarea{
  width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px;
  color:var(--text);font-size:13.5px;font-family:'Inter',sans-serif;outline:none;resize:none;
}
.field input:focus,.field textarea:focus{border-color:var(--teal);}
.field input:disabled,.field textarea:disabled{opacity:.5;}
.field-row{display:flex;gap:12px;}
.field-row .field{flex:1;}
.fee-line{display:flex;justify-content:space-between;padding:10px 13px;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-size:12.5px;color:var(--text-dim);margin-bottom:15px;}
.fee-line b{font-family:'IBM Plex Mono',monospace;color:var(--text);}
.create-foot{display:flex;gap:10px;margin-top:22px;}
.create-foot .btn{flex:1;padding:12px;text-align:center;}
.hint{font-size:11px;color:var(--text-mute);margin-top:8px;line-height:1.5;}
.warn{color:var(--gold);}

/* ---------- coin detail ---------- */
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-mute);font-size:13px;margin:22px 0 18px;}
.back-link:hover{color:var(--text);}
.detail{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start;}
@media (max-width:880px){.detail{grid-template-columns:1fr;}}

.d-head{display:flex;gap:16px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
.d-icon{width:60px;height:60px;border-radius:16px;font-size:22px;}
.d-head .n{font-size:22px;font-weight:700;}
.d-head .t{color:var(--text-mute);font-family:'IBM Plex Mono',monospace;font-size:14px;}
.d-head .creator{font-size:12px;color:var(--text-mute);margin-top:3px;}
.d-head .creator b{color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
.d-links{display:flex;gap:8px;margin-left:auto;}
.d-links a{font-size:12px;color:var(--text-dim);border:1px solid var(--border);background:var(--surface);padding:5px 11px;border-radius:8px;}
.d-links a:hover{border-color:#2a3c48;color:var(--text);}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;}
.price-row{display:flex;align-items:baseline;gap:12px;margin-bottom:4px;}
.price-row .p{font-size:28px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.chart-wrap{margin-top:16px;}
canvas#chart{width:100%;height:220px;display:block;}
.mcap-row{display:flex;gap:22px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border-soft);flex-wrap:wrap;}
.mcap-item span{display:block;font-size:11px;color:var(--text-mute);margin-bottom:3px;}
.mcap-item b{font-family:'IBM Plex Mono',monospace;font-size:14.5px;}

.tabs{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:10px;}
.tab{flex:1;text-align:center;padding:9px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-mute);cursor:pointer;}
.tab.active{background:var(--bg-elevated);color:var(--text);}
.tab.active.buy{color:var(--pos);}
.tab.active.sell{color:var(--neg);}

.trade-panel{margin-top:16px;}
.amt-input{
  display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border:1px solid var(--border);
  border-radius:12px;padding:14px;margin-top:8px;
}
.amt-input input{background:none;border:none;outline:none;color:var(--text);font-size:21px;font-family:'IBM Plex Mono',monospace;width:60%;}
.amt-input .cur{font-size:13px;color:var(--text-mute);font-weight:600;}
.quick-amts{display:flex;gap:8px;margin-top:9px;}
.quick-amts button{flex:1;padding:7px;border-radius:8px;border:1px solid var(--border);font-size:12px;color:var(--text-dim);background:var(--surface);}
.quick-amts button:hover{border-color:#2a3c48;}
.receive-est{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-mute);margin-top:12px;padding:0 2px;}
.receive-est b{color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
.trade-btn{width:100%;padding:13px;border-radius:12px;font-weight:700;font-size:14px;margin-top:14px;}
.trade-btn.buy{background:var(--pos);color:#04241a;}
.trade-btn.sell{background:var(--neg);color:#2a0510;}
.trade-btn.neutral{background:var(--grad);color:#03211c;}
.trade-btn:disabled{opacity:.4;cursor:not-allowed;}
.slip-row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--text-mute);flex-wrap:wrap;}
.slip-row .chip{padding:4px 10px;border-radius:8px;font-size:11.5px;}

.info-panel{margin-top:6px;font-size:12.5px;}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-soft);color:var(--text-mute);gap:10px;}
.info-row b{color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-weight:500;text-align:right;overflow:hidden;text-overflow:ellipsis;}
.info-row:last-child{border-bottom:none;}

table.trades{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px;}
table.trades th{text-align:left;color:var(--text-mute);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--border-soft);font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
table.trades td{padding:9px 6px;border-bottom:1px solid var(--border-soft);font-family:'IBM Plex Mono',monospace;}
table.trades tr:last-child td{border-bottom:none;}
.side-tag{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;}
.side-tag.buy{color:var(--pos);background:rgba(31,230,168,.1);}
.side-tag.sell{color:var(--neg);background:rgba(255,107,129,.1);}

.how p{color:var(--text-dim);font-size:13px;line-height:1.65;margin-top:8px;}
.how b{color:var(--text);}
.split-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:12px;border:1px solid var(--border-soft);}
.split-lp{background:var(--grad);}
.split-tr{background:var(--gold);}
.split-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--text-mute);margin-top:6px;}

#toasts{position:fixed;bottom:22px;right:22px;z-index:100;display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
.toast{
  background:var(--bg-elevated);border:1px solid var(--border);border-left:3px solid var(--teal);
  border-radius:10px;padding:12px 16px;min-width:230px;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.4);
  animation:slidein .25s ease;
}
.toast.err{border-left-color:var(--neg);}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast .tt{font-size:13px;font-weight:600;}
.toast .ts{font-size:11px;color:var(--text-mute);margin-top:3px;font-family:'IBM Plex Mono',monospace;word-break:break-all;}
.toast a{color:var(--blue);}

.empty{text-align:center;padding:60px 20px;color:var(--text-mute);grid-column:1/-1;}
.footer-note{text-align:center;color:var(--text-mute);font-size:11.5px;margin-top:60px;line-height:1.9;}
.footer-note b{color:var(--text-dim);}
.footer-note .mono{word-break:break-all;}

@media (max-width:640px){
  header{padding:12px 16px;}
  main{padding:0 16px 60px;}
  .hero{padding:30px 22px;}
  .hero h1{font-size:30px;}
  .hill{flex-wrap:wrap;}
  .hill-prog{width:100%;order:3;}
  .d-links{margin-left:0;}
}
</style>
</head>
<body>

<div class="bg-arcs">
  <svg viewBox="0 0 900 900" fill="none">
    <path d="M900 0C900 400 700 700 300 900" stroke="url(#g1)" stroke-width="1.5" opacity="0.5"/>
    <path d="M900 80C900 440 660 720 260 900" stroke="url(#g1)" stroke-width="1" opacity="0.35"/>
    <path d="M900 -80C900 340 740 660 340 900" stroke="url(#g1)" stroke-width="1" opacity="0.25"/>
    <defs>
      <linearGradient id="g1" x1="900" y1="0" x2="300" y2="900" gradientUnits="userSpaceOnUse">
        <stop stop-color="#00E6C3"/>
        <stop offset="1" stop-color="#3D8BFF"/>
      </linearGradient>
    </defs>
  </svg>
</div>

<div id="app"></div>
<div id="toasts"></div>

<script>
"use strict";
/* =====================================================================
   Monarch Pad — pump.fun-style launchpad frontend for Arc (Circle's L1).
   Single file, zero dependencies: raw JSON-RPC + hand-encoded calldata.
   Quotes come from the contracts' own quoteBuy/quoteSell view functions,
   so the numbers shown are exactly what the chain will do.
   ===================================================================== */

const CONFIG = {
  RPC: 'https://rpc.testnet.arc.network',
  CHAIN_ID: 5042002, CHAIN_ID_HEX: '0x4cef52', CHAIN_NAME: 'Arc Testnet',
  EXPLORER: 'https://testnet.arcscan.app',
  USDC: '0x3600000000000000000000000000000000000000', // 6 decimals; also the gas token
  FACTORY: '0x6906B5CD3d9f46B4A79Df0d6f244Da2b8E8D15d1', // PadFactory (Arc testnet)
  START_BLOCK: 60913000,
  API_BASE: '',            // pad-indexer worker URL ('' = direct RPC only)
  GAS_BUFFER_RAW: 1000000n, // 1 USDC kept back for gas — gas IS USDC on Arc
  HOOK_FEE_BPS: 200, // default; each coin's actual fee is chosen at launch (factory.feeBpsOf)
  LOG_LOOKBACK: 200000,     // max blocks scanned back for a coin's trade feed
};

/* ---------------- selectors & topics --------------------------------- */
const SEL = {
  // PadFactory
  createToken:'0xd6928a6c', createTokenAdvanced:'0x5fe8acae', launchFee:'0xcf3cf573', launchCount:'0x27cca59f',
  launches:'0x7b443a76', curveForToken:'0x8580756c', treasury:'0x61d027b3',
  curveParams:'0x07b5204e', defaultFeeBps:'0xbcae25a4', maxFeeBps:'0xbf769a3f', maxTeamAllocBps:'0x2955031b',
  // PadBondingCurve
  buy:'0x40993b26', sell:'0xd3c9727c', quoteBuy:'0x4beb394c', quoteSell:'0xa64190c4',
  currentPrice:'0x9d1b464a', marketCap:'0x2c135b93', usdcRaised:'0x92d6b6f3',
  tokenReserve:'0xcbcb3171', graduated:'0xe7c2b772', virtualUsdc:'0xe2c1936c',
  graduationMarketCap:'0x90017148', token:'0xfc0c546a', treasuryBps:'0x4dc10ea1',
  totalSupply:'0x902d55a5', creator:'0x02d05d3f', metadata:'0x392f37e9',
  // ERC-20
  balanceOf:'0x70a08231', allowance:'0xdd62ed3e', approve:'0x095ea7b3',
  name:'0x06fdde03', symbol:'0x95d89b41',
};
const TOPIC_CREATED   = '0x463df9e040f1a9181ece2287496672134faffc6e35d4118f691d4280c8a68ee1';
const TOPIC_BOUGHT    = '0x27330bd7589580547b6437e08f9c60653de63691d2d2b2c13bff9ee67da2a68d';
const TOPIC_SOLD      = '0x490fdc1c23c0f3a84bf80a0384eaadcb9188c9ef71b9430da391a0e4c4c39bf6';
const TOPIC_GRADUATED = '0x011a68f6d1c4aefe4ffcb9d64bf146e432e6de2e5f25b5c68110c7c0086a61bb';

/* ---------------- tiny ABI + RPC helpers ------------------------------ */
const strip0x = h => h && h.startsWith('0x') ? h.slice(2) : (h||'');
const pad32 = h => strip0x(h).padStart(64,'0');
const encUint = n => pad32(BigInt(n).toString(16));
const encAddr = a => pad32(a.toLowerCase());
const decUint = (hex, word=0) => {
  const d = strip0x(hex);
  if(d.length < (word+1)*64) return 0n;
  return BigInt('0x' + d.slice(word*64,(word+1)*64));
};
const decAddr = (hex, word=0) => '0x' + strip0x(hex).slice(word*64+24, (word+1)*64);
// decode a dynamic string whose offset sits at head slot `word` of ABI data
function decString(hex, word=0){
  try{
    const d = strip0x(hex);
    const off = Number(decUint(hex, word));       // byte offset into data
    const lenWord = off/32;
    const len = Number(decUint(hex, lenWord));
    const start = (lenWord+1)*64;
    const raw = d.slice(start, start + len*2);
    const bytes = new Uint8Array(len);
    for(let i=0;i<len;i++) bytes[i] = parseInt(raw.slice(i*2,i*2+2),16) || 0;
    return new TextDecoder().decode(bytes);
  }catch(e){ return ''; }
}
// encode a JS string as an ABI dynamic-string tail chunk (len word + padded bytes)
function encStringChunk(s){
  const bytes = new TextEncoder().encode(s);
  let hex = '';
  for(const b of bytes) hex += b.toString(16).padStart(2,'0');
  const padded = hex.padEnd(Math.ceil(hex.length/64)*64 || 64, '0');
  return encUint(bytes.length) + (bytes.length ? padded : '0'.repeat(64)).slice(0, bytes.length? padded.length : 64);
}

let rpcId = 1;
async function rpc(method, params){
  const res = await fetch(CONFIG.RPC, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({jsonrpc:'2.0', id:rpcId++, method, params})});
  const j = await res.json();
  if(j.error) throw new Error(j.error.message || 'RPC error');
  return j.result;
}
// batched JSON-RPC: one POST, array of requests. Returns results aligned with
// the input array; failed items come back as null.
async function rpcBatch(reqs){
  if(reqs.length===0) return [];
  const body = reqs.map(r => ({jsonrpc:'2.0', id:rpcId++, method:r.method, params:r.params}));
  const res = await fetch(CONFIG.RPC, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)});
  const j = await res.json();
  const byId = new Map();
  for(const item of (Array.isArray(j)?j:[j])) byId.set(item.id, item);
  return body.map(req => {
    const item = byId.get(req.id);
    return (item && !item.error) ? item.result : null;
  });
}
const ethCall = (to, data) => rpc('eth_call', [{to, data}, 'latest']);
const callU = async (to, data) => decUint(await ethCall(to, data));
const callReq = (to, data) => ({method:'eth_call', params:[{to, data}, 'latest']});

/* ---------------- units ----------------------------------------------- */
const USDC_DEC = 6n, TOK_DEC = 18n, WAD = 10n**18n;
function fromUnits(v, dec){ return Number(v) / Number(10n**dec); }
function parseAmount(str, dec){ // "12.34" -> bigint in `dec` decimals, or null
  if(!/^\d*\.?\d*$/.test(str) || str==='' || str==='.') return null;
  const [i, f=''] = str.split('.');
  const frac = (f + '0'.repeat(Number(dec))).slice(0, Number(dec));
  try { return BigInt(i||'0') * 10n**dec + BigInt(frac||'0'); } catch { return null; }
}

/* ---------------- formatting & escaping -------------------------------- */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => (typeof u==='string' && /^https?:\/\/[^\s]+$/i.test(u)) ? u : '';
const fmtUsd = (n,d=2)=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtCompact = n => n>=1e9?'$'+(n/1e9).toFixed(2)+'B':n>=1e6?'$'+(n/1e6).toFixed(2)+'M':n>=1e3?'$'+(n/1e3).toFixed(1)+'K':'$'+n.toFixed(2);
const fmtTok = n => n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':n.toFixed(2);
const fmtPrice = n => n===0?'$0.00':n<0.0001?'$'+n.toExponential(2):'$'+n.toFixed(6);
const shortAddr = a => a ? a.slice(0,6)+'…'+a.slice(-4) : '—';
const txLink = h => `${CONFIG.EXPLORER}/tx/${h}`;
const addrLink = a => `${CONFIG.EXPLORER}/address/${a}`;
const isAddr = a => typeof a==='string' && /^0x[0-9a-fA-F]{40}$/.test(a);

const GRADIENTS = [
  ['#00e6c3','#3d8bff'],['#ffc164','#ff6b81'],['#a78bfa','#3d8bff'],
  ['#1fe6a8','#4a7fff'],['#ff9a62','#ffc164'],['#5ee7ff','#4a7fff'],
  ['#ff6b81','#a78bfa'],['#7cf29c','#00e6c3']
];
function iconStyle(seed){
  let h=0; for(const c of String(seed||'?')) h=(h*31+c.charCodeAt(0))>>>0;
  const [a,b] = GRADIENTS[h % GRADIENTS.length];
  return `background:linear-gradient(135deg,${a},${b})`;
}
// Icon: gradient monogram, with the metadata image layered on top when it loads.
// The img URL is scheme-checked AND attribute-escaped; onerror removes the img,
// falling back to the monogram underneath.
function iconHtml(coin, extraCls){
  const letter = esc((coin.name||coin.symbol||'?').trim().charAt(0).toUpperCase() || '?');
  const img = safeUrl(coin.meta && coin.meta.img);
  return `<div class="icon ${extraCls||''}" style="${iconStyle(coin.name||coin.curve)}">${letter}${
    img ? `<img src="${esc(img)}" alt="" onerror="this.remove()">` : ''}</div>`;
}

  el.className = 'toast'+(isErr?' err':'');
  el.innerHTML = `<div class="tt">${esc(title)}</div><div class="ts">${esc(sub)}${link?` · <a href="${esc(link)}" target="_blank" rel="noopener">view tx ↗</a>`:''}</div>`;

function eth(){ return window.ethereum; }
async function connectWallet(){
  if(!eth()){ toast('No wallet found','Install MetaMask (or any injected wallet) to trade', true); return; }
  try{
    const accts = await eth().request({method:'eth_requestAccounts'});
    STATE.wallet = { address: accts[0] };
    await checkChain();
    await refreshBalances();
    toast('Wallet connected', shortAddr(STATE.wallet.address));
  }catch(e){ toast('Connection rejected', e.message||'', true); }
  render();
}
async function checkChain(){
  if(!eth()) return;
  const cid = await eth().request({method:'eth_chainId'});
  STATE.wrongChain = parseInt(cid,16) !== CONFIG.CHAIN_ID;
}
async function addArcNetwork(){
  if(!eth()){ toast('No wallet found','Install MetaMask first', true); return; }
  try{
    await eth().request({method:'wallet_addEthereumChain', params:[{
      chainId: CONFIG.CHAIN_ID_HEX,
      chainName: CONFIG.CHAIN_NAME,
      rpcUrls: [CONFIG.RPC],
      blockExplorerUrls: [CONFIG.EXPLORER],
      // Gas is literally USDC on Arc; the native value field uses 18 decimals.
      nativeCurrency: {name:'USDC', symbol:'USDC', decimals:18},
    }]});
    await checkChain(); render();
  }catch(e){ toast('Could not add network', e.message||'', true); }
}
if(window.ethereum){
  window.ethereum.on?.('accountsChanged', a=>{ STATE.wallet = a[0]?{address:a[0]}:null; refreshBalances().then(render); });
  window.ethereum.on?.('chainChanged', ()=>{ checkChain().then(render); });
}

async function refreshBalances(){
  if(!STATE.wallet || !STATE.configured) return;
  try{
    const me = encAddr(STATE.wallet.address);
    const reqs = [callReq(CONFIG.USDC, SEL.balanceOf + me)];
    const coin = STATE.cur ? STATE.coins[STATE.cur] : null;
    if(coin && coin.token) reqs.push(callReq(coin.token, SEL.balanceOf + me));
    const res = await rpcBatch(reqs);
    if(res[0]!=null) STATE.usdcBal = decUint(res[0]);
    if(res[1]!=null) STATE.tokBal = decUint(res[1]);
  }catch(e){ /* transient RPC issues are fine */ }
}

/* ---------------- factory-level loads ---------------------------------- */
async function loadFactoryStatics(){
  if(!STATE.configured || STATE.params) return;
  try{
    const res = await rpcBatch([
      callReq(CONFIG.FACTORY, SEL.launchFee),
      callReq(CONFIG.FACTORY, SEL.curveParams),
      callReq(CONFIG.FACTORY, SEL.defaultFeeBps),
      callReq(CONFIG.FACTORY, SEL.maxFeeBps),
      callReq(CONFIG.FACTORY, SEL.maxTeamAllocBps),
    ]);
    if(res[0]!=null) STATE.launchFee = decUint(res[0]);
    if(res[1]!=null) STATE.params = {
      totalSupply: decUint(res[1],0),
      virtualUsdc: decUint(res[1],1),
      gradMcap:    decUint(res[1],2),
      treasuryBps: decUint(res[1],3),
    };
    if(res[2]!=null) STATE.policy = {
      defaultFeeBps: decUint(res[2]),
      maxFeeBps: res[3]!=null ? decUint(res[3]) : 500n,
      maxTeamBps: res[4]!=null ? decUint(res[4]) : 1000n,
    };
  }catch(e){ /* retried on next poll */ }
}

/* ---------------- home data (batched) ----------------------------------
   Round trips per poll: 1 (count + dynamics batch) + 1 statics batch only
   when new coins appeared (+1 for their token name/symbol). */
async function refreshHome(){
  if(!STATE.configured) return;
  try{
    // 1) count + dynamics for every known coin, in one batch
    const known = STATE.order;
    const reqs = [callReq(CONFIG.FACTORY, SEL.launchCount)];
    for(const c of known){
      reqs.push(callReq(c, SEL.currentPrice), callReq(c, SEL.marketCap),
                callReq(c, SEL.graduated), callReq(c, SEL.usdcRaised));
    }
    const res = await rpcBatch(reqs);
    const count = res[0]!=null ? Number(decUint(res[0])) : known.length;
    known.forEach((c,i)=>{
      const coin = STATE.coins[c]; const o = 1+i*4;
      if(res[o]!=null)   coin.price = decUint(res[o]);
      if(res[o+1]!=null) coin.marketCap = decUint(res[o+1]);
      if(res[o+2]!=null) coin.graduated = decUint(res[o+2])===1n;
      if(res[o+3]!=null) coin.raisedRaw = decUint(res[o+3]);
      coin.loaded = true;
    });
    // 2) new launches?
    if(count > known.length){
      const idxs = []; for(let i=known.length;i<count;i++) idxs.push(i);
      const addrRes = await rpcBatch(idxs.map(i=>callReq(CONFIG.FACTORY, SEL.launches+encUint(i))));
      const fresh = [];
      idxs.forEach((idx,j)=>{
        if(addrRes[j]==null) return;
        const addr = decAddr(addrRes[j]).toLowerCase();
        if(!isAddr(addr) || STATE.coins[addr]) return;
        STATE.coins[addr] = newCoin(addr, idx);
        STATE.order.push(addr);
        fresh.push(addr);
      });
      await loadCoinStatics(fresh);
      // dynamics for the fresh ones
      const dyn = await rpcBatch(fresh.flatMap(c=>[
        callReq(c, SEL.currentPrice), callReq(c, SEL.marketCap),
        callReq(c, SEL.graduated), callReq(c, SEL.usdcRaised)]));
      fresh.forEach((c,i)=>{
        const coin = STATE.coins[c]; const o = i*4;
        if(dyn[o]!=null)   coin.price = decUint(dyn[o]);
        if(dyn[o+1]!=null) coin.marketCap = decUint(dyn[o+1]);
        if(dyn[o+2]!=null) coin.graduated = decUint(dyn[o+2])===1n;
        if(dyn[o+3]!=null) coin.raisedRaw = decUint(dyn[o+3]);
        coin.loaded = true;
      });
    }
    STATE.homeLoaded = true; STATE.homeError = null;
  }catch(e){ STATE.homeError = e.message || 'RPC unreachable'; }
}

// statics for a list of curves: 5 curve calls each, then name/symbol per token
async function loadCoinStatics(curves){
  const todo = curves.filter(c=>STATE.coins[c] && !STATE.coins[c].staticsLoaded);
  if(!todo.length) return;
  const res = await rpcBatch(todo.flatMap(c=>[
    callReq(c, SEL.token), callReq(c, SEL.metadata), callReq(c, SEL.creator),
    callReq(c, SEL.virtualUsdc), callReq(c, SEL.graduationMarketCap), callReq(c, SEL.totalSupply)]));
  todo.forEach((c,i)=>{
    const coin = STATE.coins[c]; const o = i*6;
    if(res[o]!=null)   coin.token = decAddr(res[o]);
    if(res[o+1]!=null){ coin.metaRaw = decString(res[o+1]); coin.meta = parseMeta(coin.metaRaw); }
    if(res[o+2]!=null) coin.creator = decAddr(res[o+2]);
    if(res[o+3]!=null) coin.virtualUsdc = decUint(res[o+3]);
    if(res[o+4]!=null) coin.gradMcap = decUint(res[o+4]);
    if(res[o+5]!=null) coin.totalSupply = decUint(res[o+5]);
  });
  const withTok = todo.filter(c=>isAddr(STATE.coins[c].token));
  const ns = await rpcBatch(withTok.flatMap(c=>[
    callReq(STATE.coins[c].token, SEL.name), callReq(STATE.coins[c].token, SEL.symbol)]));
  withTok.forEach((c,i)=>{
    const coin = STATE.coins[c];
    if(ns[i*2]!=null)   coin.name = decString(ns[i*2]);
    if(ns[i*2+1]!=null) coin.symbol = decString(ns[i*2+1]);
    coin.staticsLoaded = true;
  });
}

function parseMeta(raw){
  // metadata is attacker-controlled JSON — parse defensively, coerce to strings
  try{
    const j = JSON.parse(raw);
    if(!j || typeof j!=='object') return {};
    return {
      desc: typeof j.desc==='string' ? j.desc.slice(0,500) : '',
      img:  typeof j.img==='string'  ? j.img.slice(0,500)  : '',
      tw:   typeof j.tw==='string'   ? j.tw.slice(0,300)   : '',
      web:  typeof j.web==='string'  ? j.web.slice(0,300)  : '',
    };
  }catch(e){ return {}; }
}

// trending signal. Preferred source: the pad-indexer API (true 24h volume,
// trade counts and impersonation flags). Fallback: one getLogs over all
// curves for a recent window.
async function refreshActivity(){
  if(!STATE.configured || !STATE.order.length) return;
  if(CONFIG.API_BASE){
    try{
      const r = await fetch(CONFIG.API_BASE.replace(/\/$/,'') + '/api/coins?sort=trending&limit=200');
      if(r.ok){
        const rows = await r.json();
        for(const row of rows){
          const coin = STATE.coins[(row.curve||'').toLowerCase()];
          if(!coin) continue;
          coin.recentTrades = row.trades_24h || 0;
          coin.vol24 = row.volume_24h || 0;
          coin.flags = row.flags || '';
        }
        return;
      }
    }catch(e){ /* fall through to RPC */ }
  }
  try{
    const latest = BigInt(await rpc('eth_blockNumber',[]));
    const from = latest > 20000n ? latest - 20000n : 0n;
    const floor = from > BigInt(CONFIG.START_BLOCK) ? from : BigInt(CONFIG.START_BLOCK);
    const logs = await rpc('eth_getLogs', [{address: STATE.order,
      topics: [[TOPIC_BOUGHT, TOPIC_SOLD]],
      fromBlock: '0x'+floor.toString(16), toBlock: '0x'+latest.toString(16)}]);
    const counts = {};
    for(const lg of logs){ const a = (lg.address||'').toLowerCase(); counts[a]=(counts[a]||0)+1; }
    for(const c of STATE.order) STATE.coins[c].recentTrades = counts[c]||0;
  }catch(e){ /* best-effort — trending falls back to mcap order */ }
}

/* ---------------- detail data ------------------------------------------ */
async function loadDetail(curve){
  if(!STATE.configured) return;
  if(!STATE.coins[curve]){ STATE.coins[curve] = newCoin(curve, -1); }
  const coin = STATE.coins[curve];
  try{
    await loadCoinStatics([curve]);
    const res = await rpcBatch([
      callReq(curve, SEL.currentPrice), callReq(curve, SEL.marketCap),
      callReq(curve, SEL.graduated), callReq(curve, SEL.usdcRaised),
      callReq(curve, SEL.tokenReserve), callReq(curve, SEL.treasuryBps)]);
    if(res[0]!=null) coin.price = decUint(res[0]);
    if(res[1]!=null) coin.marketCap = decUint(res[1]);
    if(res[2]!=null) coin.graduated = decUint(res[2])===1n;
    if(res[3]!=null) coin.raisedRaw = decUint(res[3]);
    if(res[4]!=null) coin.reserve = decUint(res[4]);
    if(res[5]!=null) coin.treasuryBps = decUint(res[5]);
    coin.loaded = res[0]!=null;
  }catch(e){ /* keep last known state */ }
}

async function refreshTrades(curve){
  if(!STATE.configured) return;
  try{
    const latest = BigInt(await rpc('eth_blockNumber',[]));
    const lookback = latest > BigInt(CONFIG.LOG_LOOKBACK) ? latest - BigInt(CONFIG.LOG_LOOKBACK) : 0n;
    const floor = lookback > BigInt(CONFIG.START_BLOCK) ? lookback : BigInt(CONFIG.START_BLOCK);
    const CHUNK = 50000n;
    let to = latest, trades = [];
    while(to >= floor && trades.length < 40){
      const from = to > CHUNK ? (to - CHUNK + 1n > floor ? to - CHUNK + 1n : floor) : floor;
      const logs = await rpc('eth_getLogs', [{address: curve,
        topics: [[TOPIC_BOUGHT, TOPIC_SOLD]],
        fromBlock: '0x'+from.toString(16), toBlock: '0x'+to.toString(16)}]);
      for(const lg of logs.reverse()){
        const isBuy = lg.topics[0] === TOPIC_BOUGHT;
        trades.push({
          side: isBuy?'buy':'sell',
          trader: '0x'+lg.topics[1].slice(26),
          usdc: fromUnits(decUint(lg.data,0), USDC_DEC),
          tokens: fromUnits(decUint(lg.data,1), TOK_DEC),
          price: fromUnits(decUint(lg.data,2), TOK_DEC),
          block: parseInt(lg.blockNumber,16),
          tx: lg.transactionHash,
        });
      }
      if(from === floor) break;
      to = from - 1n;
    }
    if(STATE.cur !== curve) return; // navigated away meanwhile
    STATE.trades = trades.slice(0,40);
    const coin = STATE.coins[curve];
    const hist = [...trades].reverse().map(t=>({t:t.block, price:t.price}));
    if(coin && coin.price) hist.push({t:Number(latest), price: fromUnits(coin.price, TOK_DEC)});
    STATE.priceHistory = hist;
  }catch(e){ /* feed is best-effort */ }
}

/* ---------------- quoting ---------------------------------------------- */
let quoteSeq = 0;
async function updateQuote(){
  const seq = ++quoteSeq;
  const est = document.getElementById('estOut');
  STATE.quote = null;
  const coin = STATE.cur ? STATE.coins[STATE.cur] : null;
  if(!STATE.configured || !coin || coin.graduated){ if(est) est.textContent='—'; return; }
  const isBuy = STATE.tradeTab==='buy';
  const sym = coin.symbol||'TOKEN';
  const amt = parseAmount(STATE.amtStr, isBuy?USDC_DEC:TOK_DEC);
  if(!amt || amt<=0n){ if(est) est.textContent = isBuy?('0 '+sym):'0 USDC'; return; }
  try{
    const out = await callU(coin.curve, (isBuy?SEL.quoteBuy:SEL.quoteSell) + encUint(amt));
    if(seq !== quoteSeq) return; // stale
    STATE.quote = out;
    const el2 = document.getElementById('estOut');
    if(el2) el2.textContent = isBuy ? fmtTok(fromUnits(out,TOK_DEC))+' '+sym : fromUnits(out,USDC_DEC).toFixed(2)+' USDC';
  }catch(e){ if(est) est.textContent='quote failed'; }
}

/* ---------------- transactions ----------------------------------------- */
async function sendTx(to, data, label){
  const from = STATE.wallet.address;
  const hash = await eth().request({method:'eth_sendTransaction', params:[{from, to, data}]});
  toast(label+' submitted', shortAddr(hash), false, txLink(hash));
  for(let i=0;i<90;i++){
    await new Promise(r=>setTimeout(r,1000));
    const rec = await rpc('eth_getTransactionReceipt',[hash]).catch(()=>null);
    if(rec){
      if(rec.status === '0x1') return rec;
      throw new Error(label+' reverted on-chain');
    }
  }
  throw new Error(label+' not mined after 90s');
}

async function ensureAllowance(tokenAddr, spender, needed, label){
  const cur = await callU(tokenAddr, SEL.allowance + encAddr(STATE.wallet.address) + encAddr(spender));
  if(cur >= needed) return;
  setBusy(true, 'Approving '+label+'…'); render();
  const MAX = 'f'.repeat(64);
  await sendTx(tokenAddr, SEL.approve + encAddr(spender) + MAX, label+' approval');
  toast(label+' approved','You will not need to approve again for this contract');
}

function setBusy(b, label){ STATE.busy=b; STATE.busyLabel=label||''; }

async function doTrade(){
  const coin = STATE.cur ? STATE.coins[STATE.cur] : null;
  if(!STATE.configured || STATE.busy || !coin) return;
  if(!STATE.wallet){ connectWallet(); return; }
  if(STATE.wrongChain){ addArcNetwork(); return; }
  const isBuy = STATE.tradeTab==='buy';
  const sym = coin.symbol||'tokens';
  const amt = parseAmount(STATE.amtStr, isBuy?USDC_DEC:TOK_DEC);
  if(!amt || amt<=0n){ toast('Enter an amount','Amount must be greater than zero', true); return; }

  if(isBuy && amt > STATE.usdcBal){ toast('Insufficient USDC','Your balance is '+fromUnits(STATE.usdcBal,USDC_DEC).toFixed(2)+' USDC', true); return; }
  if(isBuy && STATE.usdcBal - amt < CONFIG.GAS_BUFFER_RAW){
    toast('Leave a gas buffer','Gas is paid in USDC on Arc — keep at least 1 USDC or you cannot transact afterwards', true); return;
  }
  if(!isBuy && amt > STATE.tokBal){ toast('Insufficient '+sym,'You hold '+fmtTok(fromUnits(STATE.tokBal,TOK_DEC)), true); return; }

  try{
    // fresh on-chain quote, then apply slippage tolerance
    const out = await callU(coin.curve, (isBuy?SEL.quoteBuy:SEL.quoteSell) + encUint(amt));
    const minOut = out * BigInt(10000 - STATE.slippageBps) / 10000n;
    const deadline = BigInt(Math.floor(Date.now()/1000) + 600);

    await ensureAllowance(isBuy?CONFIG.USDC:coin.token, coin.curve, amt, isBuy?'USDC':sym);

    setBusy(true, (isBuy?'Buying':'Selling')+'…'); render();
    const data = (isBuy?SEL.buy:SEL.sell) + encUint(amt) + encUint(minOut) + encUint(deadline);
    await sendTx(coin.curve, data, isBuy?'Buy':'Sell');

    toast((isBuy?'Buy':'Sell')+' confirmed',
      isBuy ? '+'+fmtTok(fromUnits(out,TOK_DEC))+' '+sym+' (min '+fmtTok(fromUnits(minOut,TOK_DEC))+')'
            : '+'+fromUnits(out,USDC_DEC).toFixed(2)+' USDC');
    STATE.amtStr='';
  }catch(e){
    toast('Transaction failed', (e && e.message || 'unknown error').slice(0,140), true);
  }
  setBusy(false);
  await Promise.all([loadDetail(STATE.cur), refreshBalances(), refreshTrades(STATE.cur)]);
  render();
}

/* ---------------- create flow ------------------------------------------ */
function buildMetadata(){
  const f = STATE.form;
  return JSON.stringify({desc:f.desc.trim(), img:f.img.trim(), tw:f.tw.trim(), web:f.web.trim()});
}
// full ABI encoding of createToken(string,string,string,uint256,uint256,uint256)
function encodeCreateToken(name, symbol, metadata, initialBuy, minTokensOut, deadline){
  const s1 = encStringChunk(name), s2 = encStringChunk(symbol), s3 = encStringChunk(metadata);
  const head = 6*32;
  const off1 = head, off2 = off1 + s1.length/2, off3 = off2 + s2.length/2;
  return SEL.createToken
    + encUint(off1) + encUint(off2) + encUint(off3)
    + encUint(initialBuy) + encUint(minTokensOut) + encUint(deadline)
    + s1 + s2 + s3;
}
// createTokenAdvanced(string,string,string,uint256,uint256,uint256,(uint256,bool,uint256))
// — the trailing LaunchPolicy tuple is static (3 words), so the head is 9 words.
function encodeCreateTokenAdvanced(name, symbol, metadata, initialBuy, minTokensOut, deadline, teamBps, burnLp, feeBps){
  const s1 = encStringChunk(name), s2 = encStringChunk(symbol), s3 = encStringChunk(metadata);
  const head = 9*32;
  const off1 = head, off2 = off1 + s1.length/2, off3 = off2 + s2.length/2;
  return SEL.createTokenAdvanced
    + encUint(off1) + encUint(off2) + encUint(off3)
    + encUint(initialBuy) + encUint(minTokensOut) + encUint(deadline)
    + encUint(teamBps) + encUint(burnLp?1n:0n) + encUint(feeBps)
    + s1 + s2 + s3;
}
// The creator's chosen policy, from the advanced panel; null = plain default launch.
function chosenPolicy(){
  const f = STATE.form;
  const defFee = STATE.policy ? STATE.policy.defaultFeeBps : 200n;
  const teamBps = f.teamPct.trim()==='' ? 0n : BigInt(Math.round(parseFloat(f.teamPct)*100)||0);
  const feeBps  = f.feePct.trim()===''  ? defFee : BigInt(Math.round(parseFloat(f.feePct)*100)||0);
  const burnLp  = f.lpMode !== 'lock';
  if(teamBps===0n && burnLp && feeBps===defFee) return null; // pure default
  return {teamBps, burnLp, feeBps};
}
// client-side preview of the first buy (constant-product with virtual reserves).
// Only used for display — the tx itself passes minTokensOut=0, which is safe
// because the token does not exist before this tx, so nothing can front-run it.
function previewInitialBuy(usdcRaw){
  const p = STATE.params;
  if(!p || !usdcRaw) return null;
  const in18 = usdcRaw * 10n**12n;
  const k = p.virtualUsdc * p.totalSupply;
  const newV = p.virtualUsdc + in18;
  return p.totalSupply - k/newV;
}
async function submitCreate(){
  if(!STATE.configured || STATE.busy) return;
  if(!STATE.wallet){ connectWallet(); return; }
  if(STATE.wrongChain){ addArcNetwork(); return; }
  const f = STATE.form;
  const name = f.name.trim(), ticker = f.ticker.trim().toUpperCase().replace(/^\$/,'');
  if(!name || !ticker){ toast('Missing info','Name and ticker are required', true); return; }
  if(STATE.launchFee==null){ toast('Launch fee unknown','Could not read launchFee() from the factory — try again', true); return; }
  const initialBuy = f.initialBuy.trim()==='' ? 0n : parseAmount(f.initialBuy, USDC_DEC);
  if(initialBuy===null){ toast('Bad amount','Initial buy must be a plain number of USDC', true); return; }
  const totalUsdc = STATE.launchFee + initialBuy;
  if(totalUsdc > STATE.usdcBal){
    toast('Insufficient USDC','This launch needs '+fromUnits(totalUsdc,USDC_DEC).toFixed(2)+' USDC (fee + initial buy); you have '+fromUnits(STATE.usdcBal,USDC_DEC).toFixed(2), true); return;
  }
  if(STATE.usdcBal - totalUsdc < CONFIG.GAS_BUFFER_RAW){
    toast('Leave a gas buffer','Gas is paid in USDC on Arc — keep at least 1 USDC after the launch', true); return;
  }
  const policy = chosenPolicy();
  if(policy && STATE.policy){
    if(policy.teamBps > STATE.policy.maxTeamBps){
      toast('Team allocation too high','Maximum is '+(Number(STATE.policy.maxTeamBps)/100)+'%', true); return;
    }
    if(policy.feeBps > STATE.policy.maxFeeBps){
      toast('Fee too high','Maximum is '+(Number(STATE.policy.maxFeeBps)/100)+'%', true); return;
    }
  }
  try{
    await ensureAllowance(CONFIG.USDC, CONFIG.FACTORY, totalUsdc, 'USDC');
    setBusy(true, 'Deploying coin…'); render();
    const deadline = BigInt(Math.floor(Date.now()/1000) + 600);
    const data = policy
      ? encodeCreateTokenAdvanced(name, ticker, buildMetadata(), initialBuy, 0n, deadline, policy.teamBps, policy.burnLp, policy.feeBps)
      : encodeCreateToken(name, ticker, buildMetadata(), initialBuy, 0n, deadline);
    const rec = await sendTx(CONFIG.FACTORY, data, 'Launch');
    // find the new curve in the receipt: TokenCreated(creator, token, curve, ...)
    let curveAddr = null;
    for(const lg of (rec.logs||[])){
      if(lg.topics && lg.topics[0] === TOPIC_CREATED && lg.topics.length>=4){
        curveAddr = '0x'+lg.topics[3].slice(26);
        break;
      }
    }
    setBusy(false);
    STATE.form = {name:'', ticker:'', desc:'', img:'', tw:'', web:'', initialBuy:'', teamPct:'', feePct:'', lpMode:'burn'};
    toast('Coin deployed', name+' is live on the curve');
    if(curveAddr && isAddr(curveAddr)){
      location.hash = '#/coin/'+curveAddr;
    } else {
      toast('Deployed, but…','Could not find TokenCreated in the receipt — check the home page', true);
      location.hash = '#/';
    }
  }catch(e){
    setBusy(false);
    toast('Launch failed', (e && e.message || 'unknown error').slice(0,140), true);
    render();
  }
}

/* ---------------- derived ---------------------------------------------- */
function progressPct(coin){
  const v = coin.virtualUsdc || (STATE.params && STATE.params.virtualUsdc) || 0n;
  const g = coin.gradMcap || (STATE.params && STATE.params.gradMcap) || 0n;
  if(coin.graduated) return 100;
  if(!g || g<=v) return 0;
  const mc = coin.marketCap > v ? coin.marketCap : v;
  const pct = Number((mc - v) * 10000n / (g - v)) / 100;
  return Math.max(0, Math.min(100, pct));
}
const nPrice = coin => fromUnits(coin.price, TOK_DEC);
const nMcap  = coin => fromUnits(coin.marketCap, TOK_DEC);
function gradTargetNum(coin){
  const g = (coin && coin.gradMcap) || (STATE.params && STATE.params.gradMcap) || 0n;
  return fromUnits(g, TOK_DEC);
}
function treasuryBpsNum(coin){
  const t = (coin && coin.treasuryBps) || (STATE.params && STATE.params.treasuryBps) || 0n;
  return Number(t);
}
function launchFeeStr(){
  return STATE.launchFee==null ? '—' : fmtUsd(fromUnits(STATE.launchFee, USDC_DEC));
}
function openingPriceNum(){
  const p = STATE.params;
  if(!p || !p.totalSupply) return 0;
  return fromUnits(p.virtualUsdc, TOK_DEC) / fromUnits(p.totalSupply, TOK_DEC);
}

/* ---------------- router ----------------------------------------------- */
function parseHash(){
  const h = location.hash || '#/';
  const m = h.match(/^#\/coin\/(0x[0-9a-fA-F]{40})$/);
  if(m) return {page:'coin', addr:m[1].toLowerCase()};
  if(h==='#/create') return {page:'create'};
  return {page:'home'};
}
function onRoute(){
  const r = parseHash();
  STATE.route = r;
  if(r.page==='coin'){
    if(STATE.cur !== r.addr){
      STATE.cur = r.addr;
      STATE.trades = []; STATE.priceHistory = [];
      STATE.tradeTab='buy'; STATE.amtStr=''; STATE.quote=null; STATE.tokBal=0n;
    }
    render();
    window.scrollTo({top:0,behavior:'instant'});
    if(STATE.configured){
      loadDetail(r.addr).then(()=>{ refreshBalances().then(render); render(); });
      refreshTrades(r.addr).then(render);
      loadFactoryStatics().then(render);
    }
  } else {
    STATE.cur = null;
    render();
    window.scrollTo({top:0,behavior:'instant'});
    if(STATE.configured){
      loadFactoryStatics().then(render);
      if(r.page==='home'){ refreshHome().then(()=>{ render(); refreshActivity().then(render); }); }
    }
  }
}
window.addEventListener('hashchange', onRoute);

/* ---------------- chart ------------------------------------------------- */
function drawChart(){
  const canvas = document.getElementById('chart');
  if(!canvas) return;
  const coin = STATE.cur ? STATE.coins[STATE.cur] : null;
  if(!coin) return;
  const dpr = window.devicePixelRatio||1;
  const rect = canvas.getBoundingClientRect();
  if(rect.width===0) return;
  canvas.width = rect.width*dpr; canvas.height = rect.height*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const w = rect.width, h = rect.height;
  ctx.clearRect(0,0,w,h);

  const cp = fromUnits(coin.price, TOK_DEC);
  const hist = STATE.priceHistory.length>1 ? STATE.priceHistory
    : [{t:0,price:cp||0},{t:1,price:cp||0}];
  const gradPrice = (coin.gradMcap && coin.totalSupply)
    ? fromUnits(coin.gradMcap,TOK_DEC)/fromUnits(coin.totalSupply,TOK_DEC) : 0;
  const min = Math.min(...hist.map(p=>p.price));
  const max = Math.max(...hist.map(p=>p.price), gradPrice*1.02||0);
  const range = (max-min)||max*0.1||1;
  const pad = 18;

  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for(let i=0;i<=3;i++){
    const y = pad + (h-pad*2)*(i/3);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
  }

  const pts = hist.map((p,i)=>[ (i/(hist.length-1))*w, h-pad-((p.price-min)/range)*(h-pad*2) ]);
  const up = hist[hist.length-1].price >= hist[0].price;
  const color = up ? '#1fe6a8' : '#ff6b81';

  const fill = ctx.createLinearGradient(0,0,0,h);
  fill.addColorStop(0,'rgba(0,230,195,0.25)');
  fill.addColorStop(1,'rgba(61,139,255,0)');
  ctx.beginPath();
  ctx.moveTo(pts[0][0], h);
  pts.forEach(p=>ctx.lineTo(p[0],p[1]));
  ctx.lineTo(pts[pts.length-1][0], h);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();

  const line = ctx.createLinearGradient(0,0,w,0);
  line.addColorStop(0,'#00e6c3'); line.addColorStop(1,'#3d8bff');
  ctx.beginPath();
  pts.forEach((p,i)=> i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]));
  ctx.strokeStyle = line; ctx.lineWidth = 2; ctx.lineJoin='round'; ctx.stroke();

  if(gradPrice>min && gradPrice<max){
    const gy = h-pad - ((gradPrice-min)/range)*(h-pad*2);
    ctx.beginPath(); ctx.setLineDash([4,4]);
    ctx.strokeStyle = 'rgba(255,193,100,0.6)';
    ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,193,100,0.85)';
    ctx.font='10px IBM Plex Mono';
    ctx.fillText('graduation', 6, gy-5);
  }

  const lp = pts[pts.length-1];
  ctx.beginPath(); ctx.arc(lp[0],lp[1],3.5,0,7);
  ctx.fillStyle=color; ctx.fill();
}

/* ---------------- glue --------------------------------------------------- */
function setAmt(v){ STATE.amtStr=v; const i=document.getElementById('tradeAmt'); if(i) i.value=v; updateQuote(); }

function render(){
  // preserve keyboard focus + caret across the innerHTML swap
  const ae = document.activeElement;
  const focusId = ae && ae.id && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA') ? ae.id : null;
  const selPos = focusId ? ae.selectionStart : null;

  const page = STATE.route.page;
  const body = page==='coin' ? coinView() : page==='create' ? createView() : homeView();
  document.getElementById('app').innerHTML = headerHtml() + '<main>' + body + '</main>';

  if(page==='coin') requestAnimationFrame(drawChart);
  if(focusId){
    const i = document.getElementById(focusId);
    if(i){ i.focus(); try{ if(selPos!=null) i.setSelectionRange(selPos,selPos); }catch(e){} }
  }
  if(page==='coin') updateQuote();
}
window.addEventListener('resize', drawChart);

/* ---------------- boot & polling ----------------------------------------- */
async function boot(){
  onRoute();
  if(!STATE.configured) return;
  try{
    await loadFactoryStatics();
    if(eth() && eth().selectedAddress){ STATE.wallet={address:eth().selectedAddress}; await checkChain(); }
    await refreshBalances();
    if(STATE.route.page==='home'){ await refreshHome(); refreshActivity().then(render); }
  }catch(e){ toast('Could not reach Arc RPC', (e.message||'').slice(0,120), true); }
  render();

  // home poll: every 8s (batched)
  setInterval(async ()=>{
    if(STATE.busy || STATE.route.page!=='home') return;
    await refreshHome();
    render();
  }, 8000);
  // trending signal: every 30s
  setInterval(async ()=>{
    if(STATE.busy || STATE.route.page!=='home') return;
    await refreshActivity();
    render();
  }, 30000);
  // detail poll: every 5s
  setInterval(async ()=>{
    if(STATE.busy || STATE.route.page!=='coin' || !STATE.cur) return;
    await Promise.all([loadDetail(STATE.cur), refreshBalances()]);
    render();
  }, 5000);
  // detail trade feed: every 15s
  setInterval(async ()=>{
    if(STATE.busy || STATE.route.page!=='coin' || !STATE.cur) return;
    await refreshTrades(STATE.cur);
    render();
  }, 15000);
}
boot();
