<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monarch Launchpad — Launch coins on Arc</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg:#05080c;
  --bg-elevated:#0a1017;
  --surface:#0e161d;
  --surface-2:#121c25;
  --border:#1c2a34;
  --border-soft:#141f28;
  --text:#eaf2f5;
  --text-dim:#a9b8c2;
  --text-mute:#69808d;
  --teal:#00e6c3;
  --blue:#4a7fff;
  --grad:linear-gradient(115deg,#00e6c3 0%,#3d8bff 100%);
  --grad-soft:linear-gradient(115deg,rgba(0,230,195,.14) 0%,rgba(61,139,255,.14) 100%);
  --pos:#1fe6a8;
  --neg:#ff6b81;
  --gold:#ffc164;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;}
body{min-height:100vh;overflow-x:hidden;}
h1,h2,h3,.disp{font-family:'Space Grotesk',system-ui,sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
::selection{background:rgba(0,230,195,.3);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#1c2a34;border-radius:8px;}

/* ---------- background arc motif ---------- */
.bg-arcs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.bg-arcs svg{position:absolute;top:-10%;right:-15%;width:900px;max-width:70vw;opacity:.55;}

/* ---------- shell ---------- */
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}

header{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;
  background:rgba(5,8,12,.78);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft);
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--grad);position:relative;flex-shrink:0;}
.brand-mark::after{content:"";position:absolute;inset:6px;border:2px solid var(--bg);border-radius:50%;border-right-color:transparent;transform:rotate(-45deg);}
.brand-name{font-weight:700;font-size:19px;letter-spacing:-.02em;}
.brand-name span{color:var(--teal);}
.brand-tag{font-size:10.5px;color:var(--text-mute);border:1px solid var(--border);padding:2px 7px;border-radius:20px;margin-left:2px;letter-spacing:.03em;}

nav.top{display:flex;align-items:center;gap:10px;}
.search{
  display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:8px 12px;width:230px;color:var(--text-mute);font-size:13.5px;
}
.search input{background:none;border:none;color:var(--text);width:100%;font-size:13.5px;outline:none;font-family:'Inter',sans-serif;}
.search input::placeholder{color:var(--text-mute);}

.btn{
  padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:600;transition:transform .12s ease, opacity .12s ease;
}
.btn:active{transform:scale(.96);}
.btn-grad{background:var(--grad);color:#03211c;}
.btn-grad:hover{opacity:.92;}
.btn-outline{border:1px solid var(--border);color:var(--text);background:var(--surface);}
.btn-outline:hover{border-color:#2a3c48;}
.btn-ghost{color:var(--text-dim);}
.btn-ghost:hover{color:var(--text);}

.wallet-chip{
  display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:7px 8px 7px 12px;font-size:12.5px;
}
.wallet-dot{width:7px;height:7px;border-radius:50%;background:var(--pos);box-shadow:0 0 8px var(--pos);}
.wallet-bal{font-family:'IBM Plex Mono',monospace;font-weight:600;}
.wallet-addr{color:var(--text-mute);font-family:'IBM Plex Mono',monospace;}
.wallet-avatar{width:24px;height:24px;border-radius:7px;background:var(--grad);}

main{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:0 28px 80px;}

/* ---------- hero ---------- */
.hero{
  position:relative;margin-top:26px;padding:46px 40px;border-radius:22px;overflow:hidden;
  background:radial-gradient(120% 140% at 85% -10%, rgba(61,139,255,.20), transparent 60%),
             radial-gradient(90% 120% at 5% 110%, rgba(0,230,195,.14), transparent 55%),
             var(--bg-elevated);
  border:1px solid var(--border-soft);
}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--teal);background:rgba(0,230,195,.09);border:1px solid rgba(0,230,195,.25);padding:5px 11px;border-radius:20px;margin-bottom:18px;}
.hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero h1{font-size:44px;line-height:1.08;letter-spacing:-.03em;max-width:640px;font-weight:700;}
.hero p{margin-top:14px;color:var(--text-dim);max-width:480px;font-size:15.5px;line-height:1.55;}
.hero-cta{display:flex;gap:12px;margin-top:26px;}
.hero-cta .btn{padding:12px 20px;font-size:14px;}
.hero-stats{display:flex;gap:34px;margin-top:38px;flex-wrap:wrap;}
.hero-stat b{display:block;font-family:'IBM Plex Mono',monospace;font-size:19px;color:var(--text);}
.hero-stat span{font-size:11.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.04em;}

/* ---------- section headers ---------- */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:44px 0 16px;}
.sec-head h2{font-size:19px;font-weight:600;letter-spacing:-.01em;}
.sec-head .sub{font-size:12.5px;color:var(--text-mute);}

/* ---------- king of the hill ---------- */
.hill{
  display:flex;gap:22px;align-items:center;padding:20px 22px;border-radius:18px;
  background:linear-gradient(100deg, rgba(255,193,100,.10), rgba(0,230,195,.06));
  border:1px solid rgba(255,193,100,.28);cursor:pointer;transition:border-color .15s;
}
.hill:hover{border-color:rgba(255,193,100,.55);}
.hill-icon{width:64px;height:64px;border-radius:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;color:#03211c;}
.hill-crown{position:absolute;font-size:15px;transform:translate(20px,-38px);}
.hill-mid{flex:1;min-width:0;}
.hill-mid .name-row{display:flex;align-items:center;gap:9px;}
.hill-mid .name-row b{font-size:17px;}
.hill-mid .tick{color:var(--text-mute);font-family:'IBM Plex Mono',monospace;font-size:13px;}
.hill-mid p{color:var(--text-dim);font-size:13px;margin-top:4px;max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hill-prog{width:170px;flex-shrink:0;}
.hill-right{text-align:right;flex-shrink:0;}
.hill-right b{font-size:18px;font-family:'IBM Plex Mono',monospace;}
.hill-right span{display:block;font-size:11.5px;color:var(--text-mute);margin-top:2px;}

.prog-label{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-mute);margin-bottom:5px;}
.prog-track{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;}
.prog-fill{height:100%;background:var(--grad);border-radius:6px;}

/* ---------- filters ---------- */
.filters{display:flex;gap:8px;margin-bottom:2px;}
.chip{padding:7px 14px;border-radius:9px;font-size:12.5px;border:1px solid var(--border);color:var(--text-dim);background:var(--surface);}
.chip.active{background:var(--grad-soft);border-color:rgba(0,230,195,.4);color:var(--teal);}

/* ---------- coin grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px;margin-top:18px;}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;
  transition:transform .15s ease, border-color .15s ease; position:relative; overflow:hidden;
}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad);opacity:0;transition:opacity .15s;}
.card:hover{transform:translateY(-3px);border-color:#26384420;}
.card:hover::before{opacity:1;}
.card-top{display:flex;gap:12px;align-items:flex-start;}
.icon{
  width:46px;height:46px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;color:#03211c;
}
.card-title{min-width:0;flex:1;}
.card-title .n{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-title .t{font-size:12px;color:var(--text-mute);font-family:'IBM Plex Mono',monospace;}
.chg{font-size:12px;font-family:'IBM Plex Mono',monospace;font-weight:600;padding:2px 7px;border-radius:6px;flex-shrink:0;}
.chg.pos{color:var(--pos);background:rgba(31,230,168,.1);}
.chg.neg{color:var(--neg);background:rgba(255,107,129,.1);}
.card-desc{font-size:12.5px;color:var(--text-dim);margin-top:11px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px;}
.card-stats{display:flex;justify-content:space-between;margin-top:12px;font-size:11.5px;color:var(--text-mute);}
.card-stats b{color:var(--text);font-family:'IBM Plex Mono',monospace;font-weight:600;}
.card .prog-track{margin-top:10px;}
.spark{width:100%;height:34px;margin-top:10px;display:block;}

/* ---------- create modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(2,4,6,.7);backdrop-filter:blur(4px);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:60px 20px;overflow:auto;}
.modal{width:100%;max-width:480px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:18px;padding:26px;position:relative;}
.modal h3{font-size:19px;margin-bottom:4px;}
.modal .sub{color:var(--text-mute);font-size:12.5px;margin-bottom:22px;}
.field{margin-bottom:15px;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
.field input,.field textarea{
  width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px;
  color:var(--text);font-size:13.5px;font-family:'Inter',sans-serif;outline:none;resize:none;
}
.field input:focus,.field textarea:focus{border-color:var(--teal);}
.field-row{display:flex;gap:12px;}
.field-row .field{flex:1;}
.emoji-pick{display:flex;flex-wrap:wrap;gap:8px;}
.emoji-opt{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;border:1.5px solid var(--border);background:var(--surface);}
.emoji-opt.sel{border-color:var(--teal);background:rgba(0,230,195,.1);}
.modal-close{position:absolute;top:18px;right:18px;color:var(--text-mute);font-size:18px;}
.modal-foot{display:flex;gap:10px;margin-top:22px;}
.modal-foot .btn{flex:1;padding:12px;text-align:center;}
.hint{font-size:11px;color:var(--text-mute);margin-top:6px;line-height:1.5;}

/* ---------- coin detail ---------- */
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-mute);font-size:13px;margin:22px 0 18px;}
.back-link:hover{color:var(--text);}
.detail{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start;}
@media (max-width:880px){.detail{grid-template-columns:1fr;}}

.d-head{display:flex;gap:16px;align-items:center;margin-bottom:18px;}
.d-icon{width:60px;height:60px;border-radius:16px;font-size:22px;}
.d-head .n{font-size:22px;font-weight:700;}
.d-head .t{color:var(--text-mute);font-family:'IBM Plex Mono',monospace;font-size:14px;}
.d-head .creator{font-size:12px;color:var(--text-mute);margin-top:3px;}
.d-head .creator b{color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;}
.price-row{display:flex;align-items:baseline;gap:12px;margin-bottom:4px;}
.price-row .p{font-size:28px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.chart-wrap{margin-top:16px;}
canvas#chart{width:100%;height:220px;display:block;}
.mcap-row{display:flex;gap:22px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border-soft);flex-wrap:wrap;}
.mcap-item span{display:block;font-size:11px;color:var(--text-mute);margin-bottom:3px;}
.mcap-item b{font-family:'IBM Plex Mono',monospace;font-size:14.5px;}

.tabs{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:10px;margin-top:20px;}
.tab{flex:1;text-align:center;padding:9px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-mute);}
.tab.active{background:var(--bg-elevated);color:var(--text);}
.tab.active.buy{color:var(--pos);}
.tab.active.sell{color:var(--neg);}

.trade-panel{margin-top:16px;}
.amt-input{
  display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border:1px solid var(--border);
  border-radius:12px;padding:14px;margin-top:8px;
}
.amt-input input{background:none;border:none;outline:none;color:var(--text);font-size:21px;font-family:'IBM Plex Mono',monospace;width:60%;}
.amt-input .cur{font-size:13px;color:var(--text-mute);font-weight:600;}
.quick-amts{display:flex;gap:8px;margin-top:9px;}
.quick-amts button{flex:1;padding:7px;border-radius:8px;border:1px solid var(--border);font-size:12px;color:var(--text-dim);background:var(--surface);}
.quick-amts button:hover{border-color:#2a3c48;}
.receive-est{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-mute);margin-top:12px;padding:0 2px;}
.receive-est b{color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
.trade-btn{width:100%;padding:13px;border-radius:12px;font-weight:700;font-size:14px;margin-top:14px;}
.trade-btn.buy{background:var(--pos);color:#04241a;}
.trade-btn.sell{background:var(--neg);color:#2a0510;}
.trade-btn:disabled{opacity:.4;cursor:not-allowed;}

.info-panel{margin-top:16px;font-size:12.5px;}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-soft);color:var(--text-mute);}
.info-row b{color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-weight:500;}
.info-row:last-child{border-bottom:none;}

.holders{margin-top:10px;}
.holder-row{display:flex;justify-content:space-between;padding:7px 0;font-size:12.5px;}
.holder-row .addr{color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
.holder-row .pct{color:var(--text-mute);font-family:'IBM Plex Mono',monospace;}
.holder-tag{font-size:9.5px;background:var(--grad-soft);color:var(--teal);padding:1px 6px;border-radius:8px;margin-left:6px;}

table.trades{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px;}
table.trades th{text-align:left;color:var(--text-mute);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--border-soft);font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
table.trades td{padding:9px 6px;border-bottom:1px solid var(--border-soft);font-family:'IBM Plex Mono',monospace;}
table.trades tr:last-child td{border-bottom:none;}
.side-tag{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;}
.side-tag.buy{color:var(--pos);background:rgba(31,230,168,.1);}
.side-tag.sell{color:var(--neg);background:rgba(255,107,129,.1);}

/* ---------- toast ---------- */
#toasts{position:fixed;bottom:22px;right:22px;z-index:100;display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
.toast{
  background:var(--bg-elevated);border:1px solid var(--border);border-left:3px solid var(--teal);
  border-radius:10px;padding:12px 16px;min-width:230px;box-shadow:0 10px 30px rgba(0,0,0,.4);
  animation:slidein .25s ease;
}
.toast.err{border-left-color:var(--neg);}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast .tt{font-size:13px;font-weight:600;}
.toast .ts{font-size:11px;color:var(--text-mute);margin-top:3px;font-family:'IBM Plex Mono',monospace;}

.empty{text-align:center;padding:60px 20px;color:var(--text-mute);}
.footer-note{text-align:center;color:var(--text-mute);font-size:11.5px;margin-top:60px;line-height:1.7;}
.footer-note b{color:var(--text-dim);}

@media (max-width:640px){
  header{padding:12px 16px;}
  .search{display:none;}
  main{padding:0 16px 60px;}
  .hero{padding:30px 22px;}
  .hero h1{font-size:30px;}
  .hill{flex-wrap:wrap;}
  .hill-prog{width:100%;order:3;}
}
</style>
</head>
<body>

<div class="bg-arcs">
  <svg viewBox="0 0 900 900" fill="none">
    <path d="M900 0C900 400 700 700 300 900" stroke="url(#g1)" stroke-width="1.5" opacity="0.5"/>
    <path d="M900 80C900 440 660 720 260 900" stroke="url(#g1)" stroke-width="1" opacity="0.35"/>
    <path d="M900 -80C900 340 740 660 340 900" stroke="url(#g1)" stroke-width="1" opacity="0.25"/>
    <defs>
      <linearGradient id="g1" x1="900" y1="0" x2="300" y2="900" gradientUnits="userSpaceOnUse">
        <stop stop-color="#00E6C3"/>
        <stop offset="1" stop-color="#3D8BFF"/>
      </linearGradient>
    </defs>
  </svg>
</div>

<div id="app"></div>
<div id="toasts"></div>

<script>
/* ===================== helpers ===================== */
const fmtUsd = (n, d=2) => '$' + n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtCompact = (n) => {
  if(n>=1e9) return '$'+(n/1e9).toFixed(2)+'B';
  if(n>=1e6) return '$'+(n/1e6).toFixed(2)+'M';
  if(n>=1e3) return '$'+(n/1e3).toFixed(1)+'K';
  return '$'+n.toFixed(2);
};
const fmtTok = (n) => {
  if(n>=1e9) return (n/1e9).toFixed(2)+'B';
  if(n>=1e6) return (n/1e6).toFixed(2)+'M';
  if(n>=1e3) return (n/1e3).toFixed(1)+'K';
  return n.toFixed(0);
};
const fmtPrice = (n) => {
  if(n===0) return '$0.00';
  if(n<0.0001) return '$'+n.toExponential(2);
  return '$'+n.toFixed(6);
};
const timeAgo = (ts)=>{
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return s+'s ago';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
};
const randAddr = () => '0x'+Array.from({length:40},()=>'0123456789abcdef'[Math.floor(Math.random()*16)]).join('');
const shortAddr = (a) => a.slice(0,6)+'…'+a.slice(-4);
const rand = (a,b)=> a + Math.random()*(b-a);
const pick = (arr)=> arr[Math.floor(Math.random()*arr.length)];
const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));

const GRADIENTS = [
  ['#00e6c3','#3d8bff'],['#ffc164','#ff6b81'],['#a78bfa','#3d8bff'],
  ['#1fe6a8','#4a7fff'],['#ff9a62','#ffc164'],['#5ee7ff','#4a7fff'],
  ['#ff6b81','#a78bfa'],['#7cf29c','#00e6c3']
];
function coinGrad(seed){
  let h=0; for(const c of seed) h=(h*31+c.charCodeAt(0))>>>0;
  return GRADIENTS[h % GRADIENTS.length];
}
function iconStyle(seed){
  const [a,b] = coinGrad(seed);
  return `background:linear-gradient(135deg,${a},${b})`;
}

/* ===================== bonding curve engine ===================== */
// pump.fun-style constant-product virtual reserves, denominated in testnet USDC
const TOTAL_SUPPLY = 1_000_000_000;
const INIT_VUSDC = 4200;
const INIT_VTOKEN = 1_000_000_000;
const GRADUATION_MCAP = 42000;
const FEE_BPS = 100; // 1%

function priceOf(coin){ return coin.vUsdc / coin.vToken; }
function marketCap(coin){ return priceOf(coin) * TOTAL_SUPPLY; }
function progressPct(coin){ return clamp((marketCap(coin)/GRADUATION_MCAP)*100,0,100); }

function quoteBuy(coin, usdcIn){
  const fee = usdcIn*(FEE_BPS/10000);
  const netIn = usdcIn-fee;
  const k = coin.vUsdc*coin.vToken;
  const newVUsdc = coin.vUsdc+netIn;
  const newVToken = k/newVUsdc;
  const tokensOut = coin.vToken-newVToken;
  return {tokensOut, newVUsdc, newVToken, fee};
}
function quoteSell(coin, tokensIn){
  const k = coin.vUsdc*coin.vToken;
  const newVToken = coin.vToken+tokensIn;
  const newVUsdc = k/newVToken;
  const usdcOutGross = coin.vUsdc-newVUsdc;
  const fee = usdcOutGross*(FEE_BPS/10000);
  return {usdcOut:usdcOutGross-fee, newVUsdc, newVToken, fee};
}

function makeCoin({name,ticker,desc,creator,ageMs,seedTrades}){
  const coin = {
    id: Math.random().toString(36).slice(2,10),
    name, ticker, desc, creator,
    createdAt: Date.now()-ageMs,
    vUsdc: INIT_VUSDC, vToken: INIT_VTOKEN,
    trades: [], holders: {}, priceHistory: [],
    graduated: false,
    replies: [],
  };
  coin.holders[creator] = 0;
  // simulate organic early trading history
  let t = coin.createdAt;
  for(let i=0;i<seedTrades;i++){
    t += rand(20_000, 400_000);
    const isBuy = Math.random() < 0.62;
    const trader = randAddr();
    if(isBuy){
      const amt = rand(15, 900);
      const q = quoteBuy(coin, amt);
      coin.vUsdc = q.newVUsdc; coin.vToken = q.newVToken;
      coin.holders[trader] = (coin.holders[trader]||0) + q.tokensOut;
      coin.trades.push({side:'buy', usdc:amt, tokens:q.tokensOut, trader, ts:t, price:priceOf(coin)});
    } else {
      const holderKeys = Object.keys(coin.holders).filter(k=>coin.holders[k]>0);
      if(holderKeys.length===0) continue;
      const trader2 = pick(holderKeys);
      const bal = coin.holders[trader2];
      const sellAmt = bal*rand(0.2,0.7);
      if(sellAmt<1) continue;
      const q = quoteSell(coin, sellAmt);
      coin.vUsdc = q.newVUsdc; coin.vToken = q.newVToken;
      coin.holders[trader2] -= sellAmt;
      coin.trades.push({side:'sell', usdc:q.usdcOut, tokens:sellAmt, trader:trader2, ts:t, price:priceOf(coin)});
    }
    coin.priceHistory.push({t, price:priceOf(coin)});
  }
  if(coin.priceHistory.length===0) coin.priceHistory.push({t:coin.createdAt, price:priceOf(coin)});
  coin.graduated = marketCap(coin) >= GRADUATION_MCAP;
  return coin;
}

function sparkPath(coin, w=260,h=34){
  const hist = coin.priceHistory.slice(-24);
  if(hist.length<2) return '';
  const min = Math.min(...hist.map(p=>p.price));
  const max = Math.max(...hist.map(p=>p.price));
  const range = (max-min)||1;
  const step = w/(hist.length-1);
  return hist.map((p,i)=>{
    const x = i*step;
    const y = h - ((p.price-min)/range)*h;
    return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
}

function drawChart(coin){
  const canvas = document.getElementById('chart');
  if(!canvas) return;
  const dpr = window.devicePixelRatio||1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width*dpr; canvas.height = rect.height*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const w = rect.width, h = rect.height;
  ctx.clearRect(0,0,w,h);

  const hist = coin.priceHistory.length>1 ? coin.priceHistory : [{t:0,price:priceOf(coin)},{t:1,price:priceOf(coin)}];
  const min = Math.min(...hist.map(p=>p.price));
  const max = Math.max(...hist.map(p=>p.price));
  const range = (max-min)||max*0.1||1;
  const pad = 18;

  // grid
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for(let i=0;i<=3;i++){
    const y = pad + (h-pad*2)*(i/3);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
  }

  const first = hist[0].price, last = hist[hist.length-1].price;
  const up = last>=first;
  const color = up ? '#1fe6a8' : '#ff6b81';

  const pts = hist.map((p,i)=>{
    const x = (i/(hist.length-1))*w;
    const y = h-pad - ((p.price-min)/range)*(h-pad*2);
    return [x,y];
  });

  // area fill
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, up?'rgba(31,230,168,0.22)':'rgba(255,107,129,0.22)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.moveTo(pts[0][0], h);
  pts.forEach(p=>ctx.lineTo(p[0],p[1]));
  ctx.lineTo(pts[pts.length-1][0], h);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // line
  ctx.beginPath();
  pts.forEach((p,i)=> i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]));
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.lineJoin='round';
  ctx.stroke();

  // graduation line
  const gradPrice = GRADUATION_MCAP/TOTAL_SUPPLY;
  if(gradPrice>min && gradPrice<max){
    const gy = h-pad - ((gradPrice-min)/range)*(h-pad*2);
    ctx.beginPath();
    ctx.setLineDash([4,4]);
    ctx.strokeStyle = 'rgba(255,193,100,0.6)';
    ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,193,100,0.85)';
    ctx.font='10px IBM Plex Mono';
    ctx.fillText('graduation', 6, gy-5);
  }

  // last point dot
  const lp = pts[pts.length-1];
  ctx.beginPath(); ctx.arc(lp[0],lp[1],3.5,0,7);
  ctx.fillStyle=color; ctx.fill();
}

    est.textContent = q.usdcOut.toFixed(2)+' USDC';
  }
}
function doTrade(side){
  const coin = COINS.find(c=>c.id===STATE.currentCoinId);
  if(!coin) return;
  if(!STATE.wallet){ connectWallet(); return; }
  const input = document.getElementById('tradeAmt');
  const v = parseFloat(input.value)||0;
  if(v<=0){ toast('Enter an amount', 'Amount must be greater than zero', true); return; }

  if(side==='buy'){
    if(v > STATE.wallet.usdc){ toast('Insufficient balance', 'Not enough testnet USDC', true); return; }
    const q = quoteBuy(coin, v);
    coin.vUsdc = q.newVUsdc; coin.vToken = q.newVToken;
    coin.holders[STATE.wallet.address] = (coin.holders[STATE.wallet.address]||0)+q.tokensOut;
    STATE.wallet.usdc -= v;
    coin.trades.push({side:'buy', usdc:v, tokens:q.tokensOut, trader:STATE.wallet.address, ts:Date.now(), price:priceOf(coin)});
    coin.priceHistory.push({t:Date.now(), price:priceOf(coin)});
    if(!coin.graduated && marketCap(coin)>=GRADUATION_MCAP){
      coin.graduated = true;
      toast('🎓 '+coin.name+' graduated!', 'Liquidity migrated to ArcSwap');
    }
    toast('Buy confirmed', `Settled in ${Math.floor(rand(180,760))}ms · +${fmtTok(q.tokensOut)} ${coin.ticker.replace('$','')}`);
  } else {
    const myBal = coin.holders[STATE.wallet.address]||0;
    if(v > myBal){ toast('Insufficient token balance', "You don't hold that much", true); return; }
    const q = quoteSell(coin, v);
    coin.vUsdc = q.newVUsdc; coin.vToken = q.newVToken;
    coin.holders[STATE.wallet.address] -= v;
    STATE.wallet.usdc += q.usdcOut;
    coin.trades.push({side:'sell', usdc:q.usdcOut, tokens:v, trader:STATE.wallet.address, ts:Date.now(), price:priceOf(coin)});
    coin.priceHistory.push({t:Date.now(), price:priceOf(coin)});
    toast('Sell confirmed', `Settled in ${Math.floor(rand(180,760))}ms · +${q.usdcOut.toFixed(2)} USDC`);
  }
  input.value='';
  render();
}

/* ---------- create modal ---------- */
function createModalHtml(){
  const f = STATE.createForm;
  const canSubmit = f.name.trim() && f.ticker.trim();
  return `
  <div class="overlay" onclick="if(event.target===this){STATE.showCreate=false;render();}">
    <div class="modal">
      <button class="modal-close" onclick="STATE.showCreate=false;render();">✕</button>
      <h3>Launch a coin</h3>
      <div class="sub">Fair launch on Arc testnet · no presale · bonding curve starts the moment you submit</div>

      <div class="field">
        <label>Icon</label>
        <div class="emoji-pick">
          ${EMOJIS.map(e=>`<div class="emoji-opt ${f.emoji===e?'sel':''}" onclick="STATE.createForm.emoji='${e}';render();">${e}</div>`).join('')}
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Coin name</label>
          <input placeholder="e.g. ArcDog" value="${f.name}" oninput="STATE.createForm.name=this.value" />
        </div>
        <div class="field">
          <label>Ticker</label>
          <input placeholder="e.g. ARCDOG" value="${f.ticker}" oninput="STATE.createForm.ticker=this.value" maxlength="10" />
        </div>
      </div>
      <div class="field">
        <label>Description</label>
        <textarea rows="3" placeholder="What's this coin about?" oninput="STATE.createForm.desc=this.value">${f.desc}</textarea>
      </div>
      <div class="field">
        <label>Initial buy (optional)</label>
        <input type="number" min="0" placeholder="0.00 USDC" value="${f.initialBuy}" oninput="STATE.createForm.initialBuy=this.value" />
        <div class="hint">Buying your own coin at launch is common — it seeds the first candle and signals conviction. ${STATE.wallet? 'Balance: '+STATE.wallet.usdc.toFixed(2)+' USDC' : 'Connect a wallet to buy in on launch.'}</div>
      </div>
      <div class="hint">Deploying creates a new ERC-20 on Arc testnet with a fixed 1,000,000,000 supply, locked to a bonding curve until it graduates to ArcSwap at ${fmtCompact(GRADUATION_MCAP)} market cap. Gas is paid in testnet USDC.</div>
      <div class="modal-foot">
        <button class="btn btn-outline" onclick="STATE.showCreate=false;render();">Cancel</button>
        <button class="btn btn-grad" style="opacity:${canSubmit?1:.5}" onclick="submitCreate()">Deploy coin</button>
      </div>
    </div>
  </div>`;
}
function submitCreate(){
  const f = STATE.createForm;
  if(!f.name.trim() || !f.ticker.trim()){ toast('Missing info', 'Name and ticker are required', true); return; }
  const ticker = '$'+f.ticker.trim().toUpperCase().replace(/^\$/,'');
  const newCoin = makeCoin({
    name: f.name.trim(), ticker, desc: f.desc.trim() || 'No description provided.',
    creator: STATE.wallet ? STATE.wallet.address : randAddr(),
    ageMs: 0, seedTrades: 0,
  });
  COINS.unshift(newCoin);

  const buyAmt = parseFloat(f.initialBuy)||0;
  if(buyAmt>0 && STATE.wallet && buyAmt<=STATE.wallet.usdc){
    const q = quoteBuy(newCoin, buyAmt);
    newCoin.vUsdc=q.newVUsdc; newCoin.vToken=q.newVToken;
    newCoin.holders[STATE.wallet.address]=(newCoin.holders[STATE.wallet.address]||0)+q.tokensOut;
    STATE.wallet.usdc -= buyAmt;
    newCoin.trades.push({side:'buy',usdc:buyAmt,tokens:q.tokensOut,trader:STATE.wallet.address,ts:Date.now(),price:priceOf(newCoin)});
    newCoin.priceHistory.push({t:Date.now(),price:priceOf(newCoin)});
  }

  STATE.showCreate=false;
  STATE.createForm = {name:'', ticker:'', desc:'', emoji:'🚀', initialBuy:''};
  toast('Coin deployed', `${newCoin.name} is live · confirmed in ${Math.floor(rand(180,760))}ms`);
  openCoin(newCoin.id);
}

/* ===================== main render ===================== */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    ${headerHtml()}
    <main>
      ${STATE.view==='home' ? homeView() : coinView()}
    </main>
    ${STATE.showCreate ? createModalHtml() : ''}
  `;
  if(STATE.view==='coin'){
    const coin = COINS.find(c=>c.id===STATE.currentCoinId);
    if(coin) requestAnimationFrame(()=>drawChart(coin));
  }
}
window.addEventListener('resize', ()=>{
  if(STATE.view==='coin'){
    const coin = COINS.find(c=>c.id===STATE.currentCoinId);
    if(coin) drawChart(coin);
  }
});

/* ===================== ambient simulated activity ===================== */
setInterval(()=>{
  const eligible = COINS.filter(c=>!c.graduated);
  if(eligible.length===0) return;
  const coin = pick(eligible);
  const isBuy = Math.random()<0.58;
  const trader = randAddr();
  if(isBuy){
    const amt = rand(8, 500);
    const q = quoteBuy(coin, amt);
    coin.vUsdc=q.newVUsdc; coin.vToken=q.newVToken;
    coin.holders[trader]=(coin.holders[trader]||0)+q.tokensOut;
    coin.trades.push({side:'buy',usdc:amt,tokens:q.tokensOut,trader,ts:Date.now(),price:priceOf(coin)});
  } else {
    const holderKeys = Object.keys(coin.holders).filter(k=>coin.holders[k]>0 && k!==(STATE.wallet&&STATE.wallet.address));
    if(holderKeys.length===0) return;
    const trader2 = pick(holderKeys);
    const sellAmt = coin.holders[trader2]*rand(0.15,0.6);
    if(sellAmt<1) return;
    const q = quoteSell(coin, sellAmt);
    coin.vUsdc=q.newVUsdc; coin.vToken=q.newVToken;
    coin.holders[trader2]-=sellAmt;
    coin.trades.push({side:'sell',usdc:q.usdcOut,tokens:sellAmt,trader:trader2,ts:Date.now(),price:priceOf(coin)});
  }
  coin.priceHistory.push({t:Date.now(), price:priceOf(coin)});
  if(!coin.graduated && marketCap(coin)>=GRADUATION_MCAP){
    coin.graduated = true;
  }
  // re-render only if it affects what's visible, keep it light
  if(STATE.view==='home' || (STATE.view==='coin' && STATE.currentCoinId===coin.id)){
    render();
  }
}, 3800);

render();
</script>
</body>
