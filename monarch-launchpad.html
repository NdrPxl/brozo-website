<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monarch — Fair launch on Arc</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

:root{
  /* Monarch butterfly palette on a dark ink ground */
  --bg:#0b0e1d;
  --bg-elevated:#10142a;
  --surface:#131836;
  --surface-2:#181e42;
  --border:#242c58;
  --border-soft:#1b2148;
  --text:#eef0fa;
  --text-dim:#aab2d4;
  --text-mute:#6b74a0;
  --purple:#8a55e8;   /* logo #5F22BD, lifted for dark bg */
  --blue:#1c96ff;     /* logo blue */
  --grad:linear-gradient(115deg,#8a55e8 0%,#1c96ff 100%);
  --grad-soft:linear-gradient(115deg,rgba(138,85,232,.16) 0%,rgba(28,150,255,.16) 100%);
  --pos:#1fe6a8;
  --neg:#ff6b81;
  --gold:#ffc164;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;}
body{min-height:100vh;overflow-x:hidden;}
h1,h2,h3,.disp{font-family:'Space Grotesk',system-ui,sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
::selection{background:rgba(138,85,232,.35);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#242c58;border-radius:8px;}

/* ---------- background arc motif ---------- */
.bg-arcs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.bg-arcs svg{position:absolute;top:-10%;right:-15%;width:900px;max-width:70vw;opacity:.5;}

#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}

header{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;
  background:rgba(11,14,29,.8);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft);
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:32px;height:32px;border-radius:9px;background:#fff;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.brand-mark img{width:30px;height:30px;object-fit:cover;}
.brand-name{font-weight:700;font-size:19px;letter-spacing:-.02em;font-family:'Space Grotesk',sans-serif;}
.brand-name span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.brand-tag{font-size:10.5px;color:var(--text-mute);border:1px solid var(--border);padding:2px 7px;border-radius:20px;margin-left:2px;letter-spacing:.03em;}

nav.top{display:flex;align-items:center;gap:10px;}
.btn{padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:600;transition:transform .12s ease, opacity .12s ease;}
.btn:active{transform:scale(.96);}
.btn-grad{background:var(--grad);color:#fff;}
.btn-grad:hover{opacity:.92;}
.btn-outline{border:1px solid var(--border);color:var(--text);background:var(--surface);}
.btn-outline:hover{border-color:#33407c;}

.wallet-chip{
  display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:7px 12px;font-size:12.5px;
}
.wallet-dot{width:7px;height:7px;border-radius:50%;background:var(--pos);box-shadow:0 0 8px var(--pos);}
.wallet-bal{font-family:'IBM Plex Mono',monospace;font-weight:600;}
.wallet-addr{color:var(--text-mute);font-family:'IBM Plex Mono',monospace;}

main{flex:1;width:100%;max-width:1160px;margin:0 auto;padding:0 28px 80px;}

/* ---------- banner ---------- */
.banner{
  margin-top:20px;padding:11px 16px;border-radius:12px;font-size:13px;
  background:rgba(255,193,100,.08);border:1px solid rgba(255,193,100,.3);color:var(--gold);
}
.banner.grad-banner{background:var(--grad-soft);border-color:rgba(138,85,232,.45);color:var(--text);}

/* ---------- hero ---------- */
.hero{
  position:relative;margin-top:22px;padding:36px 36px 30px;border-radius:22px;overflow:hidden;
  background:radial-gradient(120% 140% at 85% -10%, rgba(28,150,255,.18), transparent 60%),
             radial-gradient(90% 120% at 5% 110%, rgba(138,85,232,.16), transparent 55%),
             var(--bg-elevated);
  border:1px solid var(--border-soft);
}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--blue);background:rgba(28,150,255,.09);border:1px solid rgba(28,150,255,.3);padding:5px 11px;border-radius:20px;margin-bottom:16px;}
.hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero h1{font-size:38px;line-height:1.1;letter-spacing:-.03em;font-weight:700;}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero p{margin-top:12px;color:var(--text-dim);max-width:560px;font-size:15px;line-height:1.55;}
.hero-stats{display:flex;gap:34px;margin-top:26px;flex-wrap:wrap;}
.hero-stat b{display:block;font-family:'IBM Plex Mono',monospace;font-size:19px;color:var(--text);}
.hero-stat span{font-size:11.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.04em;}

/* graduation progress — the hero element */
.grad-prog{margin-top:26px;}
.prog-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-mute);margin-bottom:7px;}
.prog-label b{color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
.prog-track{height:12px;border-radius:8px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border-soft);}
.prog-fill{height:100%;background:var(--grad);border-radius:8px;transition:width .6s ease;box-shadow:0 0 14px rgba(28,150,255,.5);}

/* ---------- layout ---------- */
.detail{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start;margin-top:22px;}
@media (max-width:880px){.detail{grid-template-columns:1fr;}}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;}
.price-row{display:flex;align-items:baseline;gap:12px;margin-bottom:4px;}
.price-row .p{font-size:28px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.chart-wrap{margin-top:16px;}
canvas#chart{width:100%;height:220px;display:block;}
.mcap-row{display:flex;gap:22px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border-soft);flex-wrap:wrap;}
.mcap-item span{display:block;font-size:11px;color:var(--text-mute);margin-bottom:3px;}
.mcap-item b{font-family:'IBM Plex Mono',monospace;font-size:14.5px;}

.tabs{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:10px;}
.tab{flex:1;text-align:center;padding:9px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-mute);}
.tab.active{background:var(--bg-elevated);color:var(--text);}
.tab.active.buy{color:var(--pos);}
.tab.active.sell{color:var(--neg);}

.trade-panel{margin-top:16px;}
.amt-input{
  display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border:1px solid var(--border);
  border-radius:12px;padding:14px;margin-top:8px;
}
.amt-input input{background:none;border:none;outline:none;color:var(--text);font-size:21px;font-family:'IBM Plex Mono',monospace;width:60%;}
.amt-input .cur{font-size:13px;color:var(--text-mute);font-weight:600;}
.quick-amts{display:flex;gap:8px;margin-top:9px;}
.quick-amts button{flex:1;padding:7px;border-radius:8px;border:1px solid var(--border);font-size:12px;color:var(--text-dim);background:var(--surface);}
.quick-amts button:hover{border-color:#33407c;}
.receive-est{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-mute);margin-top:12px;padding:0 2px;}
.receive-est b{color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
.trade-btn{width:100%;padding:13px;border-radius:12px;font-weight:700;font-size:14px;margin-top:14px;}
.trade-btn.buy{background:var(--pos);color:#04241a;}
.trade-btn.sell{background:var(--neg);color:#2a0510;}
.trade-btn.neutral{background:var(--grad);color:#fff;}
.trade-btn:disabled{opacity:.4;cursor:not-allowed;}
.slip-row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--text-mute);}
.slip-row .chip{padding:4px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);font-size:11.5px;}
.slip-row .chip.active{background:var(--grad-soft);border-color:rgba(138,85,232,.5);color:var(--text);}
.hint{font-size:11px;color:var(--text-mute);margin-top:8px;line-height:1.5;}
.warn{color:var(--gold);}

.info-panel{margin-top:6px;font-size:12.5px;}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-soft);color:var(--text-mute);}
.info-row b{color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-weight:500;text-align:right;}
.info-row:last-child{border-bottom:none;}

table.trades{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px;}
table.trades th{text-align:left;color:var(--text-mute);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--border-soft);font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
table.trades td{padding:9px 6px;border-bottom:1px solid var(--border-soft);font-family:'IBM Plex Mono',monospace;}
table.trades tr:last-child td{border-bottom:none;}
.side-tag{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;}
.side-tag.buy{color:var(--pos);background:rgba(31,230,168,.1);}
.side-tag.sell{color:var(--neg);background:rgba(255,107,129,.1);}

.how p{color:var(--text-dim);font-size:13px;line-height:1.65;margin-top:8px;}
.how b{color:var(--text);}
.split-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:12px;border:1px solid var(--border-soft);}
.split-lp{background:var(--grad);}
.split-tr{background:var(--gold);}
.split-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--text-mute);margin-top:6px;}

#toasts{position:fixed;bottom:22px;right:22px;z-index:100;display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
.toast{
  background:var(--bg-elevated);border:1px solid var(--border);border-left:3px solid var(--blue);
  border-radius:10px;padding:12px 16px;min-width:230px;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.4);
  animation:slidein .25s ease;
}
.toast.err{border-left-color:var(--neg);}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast .tt{font-size:13px;font-weight:600;}
.toast .ts{font-size:11px;color:var(--text-mute);margin-top:3px;font-family:'IBM Plex Mono',monospace;word-break:break-all;}
.toast a{color:var(--blue);}

.footer-note{text-align:center;color:var(--text-mute);font-size:11.5px;margin-top:60px;line-height:1.9;}
.footer-note b{color:var(--text-dim);}
.footer-note .mono{word-break:break-all;}

@media (max-width:640px){
  header{padding:12px 16px;}
  main{padding:0 16px 60px;}
  .hero{padding:26px 20px;}
  .hero h1{font-size:28px;}
}
</style>
</head>
<body>

<div class="bg-arcs">
  <svg viewBox="0 0 900 900" fill="none">
    <path d="M900 0C900 400 700 700 300 900" stroke="url(#g1)" stroke-width="1.5" opacity="0.5"/>
    <path d="M900 80C900 440 660 720 260 900" stroke="url(#g1)" stroke-width="1" opacity="0.35"/>
    <path d="M900 -80C900 340 740 660 340 900" stroke="url(#g1)" stroke-width="1" opacity="0.25"/>
    <defs>
      <linearGradient id="g1" x1="900" y1="0" x2="300" y2="900" gradientUnits="userSpaceOnUse">
        <stop stop-color="#8A55E8"/>
        <stop offset="1" stop-color="#1C96FF"/>
      </linearGradient>
    </defs>
  </svg>
</div>

<div id="app"></div>
<div id="toasts"></div>

<script>
"use strict";
/* =====================================================================
   Monarch — single-token frontend, wired to the real contracts on Arc.
   No dependencies: raw JSON-RPC + hand-encoded calldata (all params are
   static types). Quotes come from the contract's own quoteBuy/quoteSell,
   so the numbers shown are exactly what the chain will do.
   ===================================================================== */

const CONFIG = {
  RPC: 'https://rpc.testnet.arc.network',
  CHAIN_ID: 5042002,
  CHAIN_ID_HEX: '0x4cef52',
  CHAIN_NAME: 'Arc Testnet',
  EXPLORER: 'https://testnet.arcscan.app',
  USDC: '0x3600000000000000000000000000000000000000', // native-USDC ERC-20 facade, 6 decimals
  CURVE: '0x8Cf071CD8BFfF5E2A9A0317C3074e6a7763b1dA3', // BondingCurve (Arc testnet)
  TOKEN: '0x08c2740E280cFbd913cD89C1617DcDc6422a8a0c', // MonarchToken
  HOOK:  '0x4C128B81aA1Fddf20a651AeB65B68b74Fe2120Cc', // MonarchHook (3% buy fee)
  START_BLOCK: 60915255, // curve deploy block; trade feed won't scan earlier
  LOG_LOOKBACK: 200000,  // max blocks scanned back for the trade feed
  GAS_BUFFER_RAW: 1000000n, // 1 USDC kept for gas — gas IS USDC on Arc
  HOOK_FEE_BPS: 200,     // post-graduation buy fee (compile-time constant in the hook)
};

/* ---------------- selectors & topics (cast sig / cast keccak) -------- */
const SEL = {
  buy:'0x40993b26', sell:'0xd3c9727c', quoteBuy:'0x4beb394c', quoteSell:'0xa64190c4',
  currentPrice:'0x9d1b464a', marketCap:'0x2c135b93', usdcRaised:'0x92d6b6f3',
  tokenReserve:'0xcbcb3171', graduated:'0xe7c2b772', virtualUsdc:'0xe2c1936c',
  graduationMarketCap:'0x90017148', token:'0xfc0c546a', treasuryBps:'0x4dc10ea1',
  totalSupply:'0x902d55a5', balanceOf:'0x70a08231', allowance:'0xdd62ed3e', approve:'0x095ea7b3',
};
const TOPIC_BOUGHT = '0x27330bd7589580547b6437e08f9c60653de63691d2d2b2c13bff9ee67da2a68d';
const TOPIC_SOLD   = '0x490fdc1c23c0f3a84bf80a0384eaadcb9188c9ef71b9430da391a0e4c4c39bf6';

/* ---------------- tiny ABI + RPC helpers ----------------------------- */
const strip0x = h => h.startsWith('0x') ? h.slice(2) : h;
const pad32 = h => strip0x(h).padStart(64,'0');
const encUint = n => pad32(BigInt(n).toString(16));
const encAddr = a => pad32(a.toLowerCase());
const decUint = (hex, word=0) => {
  const d = strip0x(hex);
  if(d.length < (word+1)*64) return 0n;
  return BigInt('0x' + d.slice(word*64,(word+1)*64));
};
let rpcId = 1;
async function rpc(method, params){
  const res = await fetch(CONFIG.RPC, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({jsonrpc:'2.0', id:rpcId++, method, params})});
  const j = await res.json();
  if(j.error) throw new Error(j.error.message || 'RPC error');
  return j.result;
}
const ethCall = (to, data) => rpc('eth_call', [{to, data}, 'latest']);
const callU = async (to, data) => decUint(await ethCall(to, data));

/* ---------------- units ---------------------------------------------- */
const USDC_DEC = 6n, TOK_DEC = 18n, WAD = 10n**18n;
function fromUnits(v, dec){ // bigint -> number (display only)
  return Number(v) / Number(10n**dec);
}
function parseAmount(str, dec){ // "12.34" -> bigint in `dec` decimals, or null
  if(!/^\d*\.?\d*$/.test(str) || str==='' || str==='.') return null;
  const [i, f=''] = str.split('.');
  const frac = (f + '0'.repeat(Number(dec))).slice(0, Number(dec));
  try { return BigInt(i||'0') * 10n**dec + BigInt(frac||'0'); } catch { return null; }
}

/* ---------------- formatting ------------------------------------------ */
const fmtUsd = (n,d=2)=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtCompact = n => n>=1e9?'$'+(n/1e9).toFixed(2)+'B':n>=1e6?'$'+(n/1e6).toFixed(2)+'M':n>=1e3?'$'+(n/1e3).toFixed(1)+'K':'$'+n.toFixed(2);
const fmtTok = n => n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':n.toFixed(2);
const fmtPrice = n => n===0?'$0.00':n<0.0001?'$'+n.toExponential(2):'$'+n.toFixed(6);
const shortAddr = a => a ? a.slice(0,6)+'…'+a.slice(-4) : '—';
const timeAgo = ts => { const s=Math.floor((Date.now()-ts)/1000);
  return s<60?s+'s ago':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago'; };
const txLink = h => `${CONFIG.EXPLORER}/tx/${h}`;
const addrLink = a => `${CONFIG.EXPLORER}/address/${a}`;

/* ---------------- state ----------------------------------------------- */
const STATE = {
  configured: !!CONFIG.CURVE,
  wallet: null,            // {address}
  wrongChain: false,
  usdcBal: 0n, tokBal: 0n,
  curve: {                 // live contract state
    loaded:false, graduated:false,
    price:0n, marketCap:0n, raisedRaw:0n, reserve:0n,
    virtualUsdc:0n, gradMcap:0n, totalSupply:0n, treasuryBps:0n, token:'',
  },
  trades: [],              // {side, usdc, tokens, trader, price, block, tx}
  priceHistory: [],        // {t(block), price(number)}
  tradeTab:'buy',
  slippageBps: 100,        // 1% default
  amtStr:'',
  quote:null,              // bigint out for current input
  busy:false, busyLabel:'',
};

function toast(title, sub, isErr, link){
  const el = document.createElement('div');
  el.className = 'toast'+(isErr?' err':'');
  el.innerHTML = `<div class="tt">${title}</div><div class="ts">${sub}${link?` · <a href="${link}" target="_blank" rel="noopener">view tx ↗</a>`:''}</div>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s,transform .3s'; el.style.opacity='0'; el.style.transform='translateX(30px)'; setTimeout(()=>el.remove(),300); }, 5200);
}

/* ---------------- wallet ---------------------------------------------- */
function eth(){ return window.ethereum; }
async function connectWallet(){
  if(!eth()){ toast('No wallet found','Install MetaMask (or any injected wallet) to trade', true); return; }
  try{
    const accts = await eth().request({method:'eth_requestAccounts'});
    STATE.wallet = { address: accts[0] };
    await checkChain();
    await refreshBalances();
    toast('Wallet connected', shortAddr(STATE.wallet.address));
  }catch(e){ toast('Connection rejected', e.message||'', true); }
  render();
}
async function checkChain(){
  if(!eth()) return;
  const cid = await eth().request({method:'eth_chainId'});
  STATE.wrongChain = parseInt(cid,16) !== CONFIG.CHAIN_ID;
}
async function addArcNetwork(){
  if(!eth()){ toast('No wallet found','Install MetaMask first', true); return; }
  try{
    await eth().request({method:'wallet_addEthereumChain', params:[{
      chainId: CONFIG.CHAIN_ID_HEX,
      chainName: CONFIG.CHAIN_NAME,
      rpcUrls: [CONFIG.RPC],
      blockExplorerUrls: [CONFIG.EXPLORER],
      // Gas is literally USDC on Arc; the native value field uses 18 decimals.
      nativeCurrency: {name:'USDC', symbol:'USDC', decimals:18},
    }]});
    await checkChain(); render();
  }catch(e){ toast('Could not add network', e.message||'', true); }
}
if(window.ethereum){
  window.ethereum.on?.('accountsChanged', a=>{ STATE.wallet = a[0]?{address:a[0]}:null; refreshBalances().then(render); });
  window.ethereum.on?.('chainChanged', ()=>{ checkChain().then(render); });
}

async function refreshBalances(){
  if(!STATE.wallet || !STATE.configured) return;
  try{
    const me = encAddr(STATE.wallet.address);
    STATE.usdcBal = await callU(CONFIG.USDC, SEL.balanceOf + me);
    if(STATE.curve.token) STATE.tokBal = await callU(STATE.curve.token, SEL.balanceOf + me);
  }catch(e){ /* transient RPC issues are fine */ }
}

/* ---------------- curve state ------------------------------------------ */
async function loadStatics(){
  if(!STATE.configured) return;
  const c = CONFIG.CURVE;
  STATE.curve.token = CONFIG.TOKEN || '0x'+strip0x(await ethCall(c, SEL.token)).slice(24);
  STATE.curve.virtualUsdc = await callU(c, SEL.virtualUsdc);
  STATE.curve.gradMcap = await callU(c, SEL.graduationMarketCap);
  STATE.curve.totalSupply = await callU(c, SEL.totalSupply);
  STATE.curve.treasuryBps = await callU(c, SEL.treasuryBps);
}
async function refreshCurve(){
  if(!STATE.configured) return;
  const c = CONFIG.CURVE;
  try{
    STATE.curve.graduated = (await callU(c, SEL.graduated)) === 1n;
    STATE.curve.price = await callU(c, SEL.currentPrice);
    STATE.curve.marketCap = await callU(c, SEL.marketCap);
    STATE.curve.raisedRaw = await callU(c, SEL.usdcRaised);
    STATE.curve.reserve = await callU(c, SEL.tokenReserve);
    STATE.curve.loaded = true;
  }catch(e){ /* keep last known state */ }
}

/* ---------------- trade feed (real events) ----------------------------- */
async function refreshTrades(){
  if(!STATE.configured) return;
  try{
    const latest = BigInt(await rpc('eth_blockNumber',[]));
    const floor = BigInt(Math.max(CONFIG.START_BLOCK, Number(latest) - CONFIG.LOG_LOOKBACK));
    const CHUNK = 50000n;
    let to = latest, trades = [];
    while(to >= floor && trades.length < 30){
      const from = to > CHUNK ? (to - CHUNK + 1n > floor ? to - CHUNK + 1n : floor) : floor;
      const logs = await rpc('eth_getLogs', [{address: CONFIG.CURVE,
        topics: [[TOPIC_BOUGHT, TOPIC_SOLD]],
        fromBlock: '0x'+from.toString(16), toBlock: '0x'+to.toString(16)}]);
      for(const lg of logs.reverse()){
        const isBuy = lg.topics[0] === TOPIC_BOUGHT;
        trades.push({
          side: isBuy?'buy':'sell',
          trader: '0x'+lg.topics[1].slice(26),
          usdc: fromUnits(decUint(lg.data,0), USDC_DEC),
          tokens: fromUnits(decUint(lg.data,1), TOK_DEC),
          price: fromUnits(decUint(lg.data,2), TOK_DEC),
          block: parseInt(lg.blockNumber,16),
          tx: lg.transactionHash,
        });
      }
      if(from === floor) break;
      to = from - 1n;
    }
    STATE.trades = trades.slice(0,30);
    const hist = [...trades].reverse().map(t=>({t:t.block, price:t.price}));
    if(STATE.curve.price) hist.push({t:Number(latest), price: fromUnits(STATE.curve.price, TOK_DEC)});
    STATE.priceHistory = hist;
  }catch(e){ /* feed is best-effort */ }
}

/* ---------------- quoting --------------------------------------------- */
let quoteSeq = 0;
async function updateQuote(){
  const seq = ++quoteSeq;
  const est = document.getElementById('estOut');
  STATE.quote = null;
  if(!STATE.configured || STATE.curve.graduated){ if(est) est.textContent='—'; return; }
  const isBuy = STATE.tradeTab==='buy';
  const amt = parseAmount(STATE.amtStr, isBuy?USDC_DEC:TOK_DEC);
  if(!amt || amt<=0n){ if(est) est.textContent = isBuy?'0 MONARCH':'0 USDC'; return; }
  try{
    const out = await callU(CONFIG.CURVE, (isBuy?SEL.quoteBuy:SEL.quoteSell) + encUint(amt));
    if(seq !== quoteSeq) return; // stale
    STATE.quote = out;
    const el2 = document.getElementById('estOut');
    if(el2) el2.textContent = isBuy ? fmtTok(fromUnits(out,TOK_DEC))+' MONARCH' : fromUnits(out,USDC_DEC).toFixed(2)+' USDC';
  }catch(e){ if(est) est.textContent='quote failed'; }
}

/* ---------------- transactions ----------------------------------------- */
async function sendTx(to, data, label){
  const from = STATE.wallet.address;
  const hash = await eth().request({method:'eth_sendTransaction', params:[{from, to, data}]});
  toast(label+' submitted', shortAddr(hash), false, txLink(hash));
  for(let i=0;i<90;i++){
    await new Promise(r=>setTimeout(r,1000));
    const rec = await rpc('eth_getTransactionReceipt',[hash]).catch(()=>null);
    if(rec){
      if(rec.status === '0x1') return hash;
      throw new Error(label+' reverted on-chain');
    }
  }
  throw new Error(label+' not mined after 90s');
}

async function ensureAllowance(tokenAddr, spender, needed, label){
  const cur = await callU(tokenAddr, SEL.allowance + encAddr(STATE.wallet.address) + encAddr(spender));
  if(cur >= needed) return;
  setBusy(true, 'Approving '+label+'…'); render();
  const MAX = 'f'.repeat(64);
  await sendTx(tokenAddr, SEL.approve + encAddr(spender) + MAX, label+' approval');
  toast(label+' approved','You will not need to approve again');
}

function setBusy(b, label){ STATE.busy=b; STATE.busyLabel=label||''; }

async function doTrade(){
  if(!STATE.configured || STATE.busy) return;
  if(!STATE.wallet){ connectWallet(); return; }
  if(STATE.wrongChain){ addArcNetwork(); return; }
  const isBuy = STATE.tradeTab==='buy';
  const amt = parseAmount(STATE.amtStr, isBuy?USDC_DEC:TOK_DEC);
  if(!amt || amt<=0n){ toast('Enter an amount','Amount must be greater than zero', true); return; }

  if(isBuy && amt > STATE.usdcBal){ toast('Insufficient USDC','Your balance is '+fromUnits(STATE.usdcBal,USDC_DEC).toFixed(2)+' USDC', true); return; }
  if(isBuy && STATE.usdcBal - amt < CONFIG.GAS_BUFFER_RAW){
    toast('Leave a gas buffer','Gas is paid in USDC on Arc — keep at least 1 USDC or you cannot transact afterwards', true); return;
  }
  if(!isBuy && amt > STATE.tokBal){ toast('Insufficient MONARCH','You hold '+fmtTok(fromUnits(STATE.tokBal,TOK_DEC)), true); return; }

  try{
    // fresh on-chain quote, then apply slippage tolerance
    const out = await callU(CONFIG.CURVE, (isBuy?SEL.quoteBuy:SEL.quoteSell) + encUint(amt));
    const minOut = out * BigInt(10000 - STATE.slippageBps) / 10000n;
    const deadline = BigInt(Math.floor(Date.now()/1000) + 600);

    await ensureAllowance(isBuy?CONFIG.USDC:STATE.curve.token, CONFIG.CURVE, amt, isBuy?'USDC':'MONARCH');

    setBusy(true, (isBuy?'Buying':'Selling')+'…'); render();
    const data = (isBuy?SEL.buy:SEL.sell) + encUint(amt) + encUint(minOut) + encUint(deadline);
    await sendTx(CONFIG.CURVE, data, isBuy?'Buy':'Sell');

    toast((isBuy?'Buy':'Sell')+' confirmed',
      isBuy ? '+'+fmtTok(fromUnits(out,TOK_DEC))+' MONARCH (min '+fmtTok(fromUnits(minOut,TOK_DEC))+')'
            : '+'+fromUnits(out,USDC_DEC).toFixed(2)+' USDC');
    STATE.amtStr='';
  }catch(e){
    toast('Transaction failed', (e && e.message || 'unknown error').slice(0,140), true);
  }
  setBusy(false);
  await Promise.all([refreshCurve(), refreshBalances(), refreshTrades()]);
  render();
}

function progressPct(){
  const {marketCap, virtualUsdc, gradMcap} = STATE.curve;
  if(!gradMcap || gradMcap<=virtualUsdc) return 0;
  const pct = Number((marketCap - virtualUsdc) * 10000n / (gradMcap - virtualUsdc)) / 100;
  return Math.max(0, Math.min(100, pct));
}

/* ---------------- chart ------------------------------------------------ */
function drawChart(){
  const canvas = document.getElementById('chart');
  if(!canvas) return;
  const dpr = window.devicePixelRatio||1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width*dpr; canvas.height = rect.height*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const w = rect.width, h = rect.height;
  ctx.clearRect(0,0,w,h);

  const hist = STATE.priceHistory.length>1 ? STATE.priceHistory
    : [{t:0,price:priceNum()||0},{t:1,price:priceNum()||0}];
  const gradPrice = (STATE.curve.gradMcap && STATE.curve.totalSupply)
    ? fromUnits(STATE.curve.gradMcap,TOK_DEC)/fromUnits(STATE.curve.totalSupply,TOK_DEC) : 0;
  const min = Math.min(...hist.map(p=>p.price));
  const max = Math.max(...hist.map(p=>p.price), gradPrice*1.02||0);
  const range = (max-min)||max*0.1||1;
  const pad = 18;

  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for(let i=0;i<=3;i++){
    const y = pad + (h-pad*2)*(i/3);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
  }

  const pts = hist.map((p,i)=>[ (i/(hist.length-1))*w, h-pad-((p.price-min)/range)*(h-pad*2) ]);
  const up = hist[hist.length-1].price >= hist[0].price;
  const color = up ? '#1fe6a8' : '#ff6b81';

  const fill = ctx.createLinearGradient(0,0,0,h);
  fill.addColorStop(0,'rgba(138,85,232,0.28)');
  fill.addColorStop(1,'rgba(28,150,255,0)');
  ctx.beginPath();
  ctx.moveTo(pts[0][0], h);
  pts.forEach(p=>ctx.lineTo(p[0],p[1]));
  ctx.lineTo(pts[pts.length-1][0], h);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();

  const line = ctx.createLinearGradient(0,0,w,0);
  line.addColorStop(0,'#8a55e8'); line.addColorStop(1,'#1c96ff');
  ctx.beginPath();
  pts.forEach((p,i)=> i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]));
  ctx.strokeStyle = line; ctx.lineWidth = 2; ctx.lineJoin='round'; ctx.stroke();

  if(gradPrice>min && gradPrice<max){
    const gy = h-pad - ((gradPrice-min)/range)*(h-pad*2);
    ctx.beginPath(); ctx.setLineDash([4,4]);
    ctx.strokeStyle = 'rgba(255,193,100,0.6)';
    ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,193,100,0.85)';
    ctx.font='10px IBM Plex Mono';
    ctx.fillText('graduation', 6, gy-5);
  }

  const lp = pts[pts.length-1];
  ctx.beginPath(); ctx.arc(lp[0],lp[1],3.5,0,7);
  ctx.fillStyle=color; ctx.fill();
}

function render(){

  }

}

    await Promise.all([refreshCurve(), refreshBalances()]);
    render();
  }, 5000);
  setInterval(async ()=>{ if(!STATE.busy){ await refreshTrades(); render(); } }, 15000);
}
