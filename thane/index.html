<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thane</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* v0.13 Charge. Three lanes in the middle: the bot's three bots on top, yours below, each facing the one opposite.
   What you can do is on the left, what just happened on the right, your hand below. */
:root {
  --bg: #efe7d6; --panel: #f8f3e8; --ink: #241d14; --muted: #6d6250; --line: #cdbf9f;
  --gold: #0b8ea0; --gold-soft: #c9e8ec; --foe: #7a2e2e; --good: #2d6a3e; --slot: #e6dcc6;
  --shield: #1e6bff; --shield-glow: rgba(47, 123, 255, .75);
  --display: 'Cinzel', 'Georgia', serif; --body: 'IBM Plex Sans', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #17191d; --panel: #22252b; --ink: #ece4d2; --muted: #a39a86; --line: #3d414a;
    --gold: #22d3ee; --gold-soft: #10363d; --foe: #e07a7a; --good: #6fc48a; --slot: #1d2025; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #17191d; --panel: #22252b; --ink: #ece4d2; --muted: #a39a86; --line: #3d414a;
  --gold: #22d3ee; --gold-soft: #10363d; --foe: #e07a7a; --good: #6fc48a; --slot: #1d2025; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.35; }
main { max-width: 1180px; margin: 0 auto; padding: 10px 16px 28px; }
header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 8px; }
h1 { font: 700 1.25rem var(--display); margin: 0; letter-spacing: .04em; }
select, button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
button { cursor: pointer; }
button.primary { background: var(--gold); border-color: var(--gold); color: #fff; font-weight: 600; }
button:disabled { opacity: .45; cursor: default; }
.label { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; }

.scorebar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: .85rem; }
.scorebar b { font: 700 1rem var(--display); }
.pips { display: inline-flex; gap: 4px; vertical-align: middle; }
.pips i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); display: inline-block; }
.pips i.on { background: var(--foe); border-color: var(--foe); }
.killbar { flex: 0 0 180px; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; } .killbar i { display: block; height: 100%; background: var(--foe); }
.kills { display: inline-flex; align-items: baseline; gap: 5px; white-space: nowrap; }
.kills b { font: 700 1.5rem var(--display); line-height: 1; color: var(--foe); min-width: 1ch; text-align: right; display: inline-block; }
.kills em { font-style: normal; font-weight: 600; }
.scorebar .deck { margin-left: auto; color: var(--muted); }
#mid { display: grid; grid-template-columns: minmax(200px, 1fr) auto minmax(200px, 1fr); gap: 10px; margin: 8px 0; align-items: stretch; }
#mid > .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
#lanes { display: grid; grid-template-columns: repeat(3, 172px); gap: 4px 10px; }
.lane { background: var(--slot); border: 1px dashed var(--line); border-radius: 10px; padding: 5px; min-height: 222px; position: relative; display: flex; }
.lane .card { flex: 1; min-height: 210px; }
/* every lane place is the same size, filled or empty, on both sides: the card's text area takes what the picture leaves */
#lanes .lane:not(.bench):not(.benchslot) { height: var(--lane-h, 268px); min-height: 0; }
#lanes .lane:not(.bench):not(.benchslot) .card { min-height: 0; height: 100%; }
#lanes .lane .card .moves, #lanes .lane .card .txt { max-height: 78%; overflow: hidden; }
.lane .hole { flex: 1; border-radius: 8px; display: grid; place-items: center; color: var(--muted); font-size: .8rem; text-align: center; padding: 8px; cursor: default; }
.lane .hole.glow { box-shadow: 0 0 0 3px var(--gold), 0 0 14px var(--gold); cursor: pointer; color: var(--ink); }
.lane.bench { min-height: 118px; background: transparent; }
.lane.bench .card { min-height: 106px; }
.lane.bench .hole { min-height: 60px; opacity: .7; }
.card.mini .art { background-position: center 12%; opacity: .55; }
.card.mini .pw { min-width: 30px !important; height: 30px !important; font-size: 1.05rem !important; }
.card.mini .max { top: 34px; }
.card.mini .txt { font-size: .66rem; }
.pilebtn { font-size: .8rem; padding: 2px 8px; }
.pilebox { margin-top: 8px; background: var(--panel); border: 1px solid var(--gold); border-radius: 10px; padding: 8px 10px; }
.pilehead { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; } .pilehead button { margin-left: auto; }
.pilecards { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; max-height: 380px; overflow-y: auto; }
.pilecards .card { min-height: 170px; cursor: default; }
.lanelabel { text-align: center; color: var(--muted); font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; }

.card { --k: #8a8f98; position: relative; border: 2px solid var(--k); border-radius: 9px; background: var(--panel); overflow: hidden; cursor: pointer; min-height: 112px; display: flex; flex-direction: column; }
.card .art { position: absolute; inset: 0; background-size: cover; background-position: center 20%; opacity: .9; }
.card > * { position: relative; }
.card .name { font-weight: 600; font-size: .78rem; padding: 3px 34px 2px 6px; background: color-mix(in srgb, var(--k) 30%, var(--panel)); line-height: 1.15; }
.card .pw { position: absolute; top: 2px; right: 3px; min-width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--panel); font: 700 1rem var(--display); display: grid; place-items: center; border: 2px solid var(--k); }
.card.done .art { filter: grayscale(.6); opacity: .6; }
.lane .card .pw { min-width: 40px; height: 40px; font-size: 1.4rem; }
.lane .card .name { padding-right: 46px; min-height: 30px; }
.card .max { position: absolute; top: 44px; right: 4px; font-size: .62rem; background: var(--ink); color: var(--panel); border-radius: 4px; padding: 0 4px; }
.card .txt { margin-top: auto; background: color-mix(in srgb, var(--panel) 88%, transparent); font-size: .7rem; padding: 3px 6px; line-height: 1.25; }
.card .kind { font-size: .62rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 1px 6px; background: color-mix(in srgb, var(--panel) 80%, transparent); align-self: flex-start; border-radius: 0 0 6px 0; }
.card .tags { display: flex; flex-wrap: wrap; gap: 3px; padding: 2px 4px; }
.card .tags span { font-size: .62rem; background: var(--ink); color: var(--panel); border-radius: 4px; padding: 0 4px; }
.card .tags span.rest { background: var(--muted); color: var(--panel); font-style: italic; }
.cmd { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--k); border-radius: 999px; padding: 1px 10px 1px 4px; font-weight: 600; background: color-mix(in srgb, var(--k) 22%, var(--panel)); cursor: help; }
.cmd i { width: 16px; height: 16px; background: var(--k); border: 2px solid var(--ink); clip-path: polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%); }
.cmd b { font: 700 .95rem var(--display); }
.card .tags span.sh { background: var(--shield); color: #fff; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
/* what destroying this bot scores: under its energy, on both sides of the table */
.card .kw { position: absolute; top: 46px; right: 3px; min-width: 40px; text-align: center; font: 700 .86rem var(--body); line-height: 1.1; background: var(--foe); color: var(--panel); border: 1px solid var(--panel); border-radius: 6px; padding: 1px 4px 2px; box-shadow: 0 1px 2px #0006; }
.card .kw small { display: block; font-size: .5rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; opacity: .9; }
.card.mini .kw { top: 4px; right: 37px; min-width: 0; font-size: .74rem; padding: 1px 5px; display: flex; align-items: baseline; gap: 3px; } .card.mini .kw small { display: inline; }
.lane .card.mini .name { padding-right: 92px; }
/* a shielded bot: a bright ring inside the card's edge, a blue wash over the picture and a shield badge under the name.
   The ring is white on blue with a dark hairline, so it reads on the light and on the dark table and on every card colour. */
.card.shielded { border-color: var(--shield); box-shadow: 0 0 0 2px var(--shield), 0 0 16px 3px var(--shield-glow); }
.card.shielded.glow { box-shadow: 0 0 0 2px var(--shield), 0 0 0 5px var(--gold), 0 0 16px 4px var(--gold); }
.card .shield-fx { position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: 6px; background: linear-gradient(160deg, rgba(47, 123, 255, .34), rgba(47, 123, 255, .08) 45%, rgba(255, 255, 255, .22) 50%, rgba(47, 123, 255, .1) 56%, rgba(47, 123, 255, .3));
  box-shadow: inset 0 0 0 1px #0b2a66, inset 0 0 0 4px #fff, inset 0 0 0 7px var(--shield), inset 0 0 26px 8px var(--shield-glow); animation: shield-hum 2.2s ease-in-out infinite; }
.card .shield-badge { position: absolute; z-index: 3; left: 5px; top: 36px; width: 46px; height: 52px; filter: drop-shadow(0 2px 3px #000a); cursor: help; } .card .shield-badge svg { display: block; width: 100%; height: 100%; }
.card.mini .shield-badge { top: 27px; left: 4px; width: 22px; height: 25px; }
.card.shielded .tags { padding-left: 56px; min-height: 20px; } .card.shielded .tags { pointer-events: none; } .card.shielded .tags span { pointer-events: auto; } .card.mini.shielded .tags { padding-left: 30px; }
.card.shielded .txt { position: relative; z-index: 3; } .card.shielded .moves, .card.shielded .name, .card.shielded .pw, .card.shielded .kw, .card.shielded .tags { z-index: 3; }
@keyframes shield-hum { 0%, 100% { opacity: .78; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .card .shield-fx { animation: none; } }
.anim-float.shield { color: #fff; font-size: 1.2rem; letter-spacing: .04em; text-transform: uppercase; text-shadow: 0 0 2px #0b2a66, 0 0 3px #0b2a66, 0 1px 0 #0b2a66, 0 0 12px #1e6bff, 0 0 12px #1e6bff; }
.shield-pop { position: fixed; z-index: 55; pointer-events: none; }
.shield-pop i { position: absolute; left: 50%; top: 50%; width: 12px; height: 16px; margin: -8px 0 0 -6px; background: #dbe9ff; border: 2px solid #1e6bff; clip-path: polygon(50% 0, 100% 40%, 60% 100%, 0 55%); }
.shield-pop b { position: absolute; inset: 0; border-radius: 9px; box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 7px #1e6bff, 0 0 18px 4px #5aa2ff; }
.shield-pop svg { position: absolute; left: 50%; top: 50%; width: 64px; height: 72px; margin: -36px 0 0 -32px; }
.card .acts { display: flex; flex-wrap: wrap; gap: 3px; padding: 3px 4px; }
.card .acts button { font-size: .72rem; padding: 3px 6px; text-align: left; }
.card .acts button.on { background: var(--gold); border-color: var(--gold); color: #fff; }
.card .moves { margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding: 5px; background: color-mix(in srgb, var(--panel) 88%, transparent); }
.card .moves button { width: 100%; text-align: left; font-size: .76rem; font-weight: 600; padding: 6px 7px; border: 2px solid var(--gold); background: var(--panel); border-radius: 7px; line-height: 1.2; }
.card .moves button:hover:not(:disabled) { background: var(--gold-soft); }
.card .moves button.on { background: var(--gold); color: #fff; }
.card .moves button:disabled { border-color: var(--line); font-weight: 400; }
.gem { display: inline-block; width: 9px; height: 9px; transform: rotate(45deg); margin: 0 6px 1px 2px; border: 1px solid #0006; }
.g-uncommon { background: #b9c4cf; } .g-rare { background: #f2c230; } .g-legendary { background: #ff5fd2; box-shadow: 0 0 6px #ff5fd2; }
.card .moves small.ab { color: var(--ink); font-weight: 600; }
.card .moves small { font-size: .66rem; color: var(--muted); padding: 0 2px; }
.card.glow { box-shadow: 0 0 0 3px var(--gold), 0 0 14px var(--gold); }
.card.sel { box-shadow: 0 0 0 3px var(--ink); transform: translateY(-6px); }
.card.dim { opacity: .55; }
.k-red { --k: #b8433a; } .k-chrome { --k: #93a5b5; } .k-gold { --k: #d4a63a; } .k-volt { --k: #4f7cff; } .k-moss { --k: #4f9d4a; } .k-void { --k: #8b4fd8; } .k-neutral { --k: #9a8f7a; }
.back { background: repeating-linear-gradient(45deg, #343841 0 8px, #23262c 8px 16px); border: 2px solid #555; border-radius: 6px; width: 22px; height: 30px; display: inline-block; margin-right: 2px; }

#mid h2 { font: 700 1rem var(--display); margin: 0 0 4px; }
#info { font-size: .85rem; color: var(--ink); margin-bottom: 6px; }
#info .why { color: var(--muted); }
#actions { display: flex; flex-wrap: wrap; gap: 6px; }
#log { font-size: .8rem; max-height: 230px; overflow-y: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 10px; }
.chips .label { margin: 0 4px 0 0; }
.chips span:not(.label) { font-size: .72rem; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
.chips span.used { background: var(--line); color: var(--muted); text-decoration: line-through; }
.drag-ghost { position: fixed; z-index: 60; pointer-events: none; margin: 0; transform: rotate(-3deg) scale(1.06); box-shadow: 0 8px 18px rgba(0,0,0,.4); }
.drop-ok { outline: 2px dashed var(--gold); outline-offset: 2px; }
.drop-on { outline: 3px solid var(--gold); outline-offset: 2px; }
#hand .card, #lanes .mine .card { touch-action: none; user-select: none; cursor: grab; }
#log div { padding: 1px 0; color: var(--muted); }
#log div.new { color: var(--ink); }
#log div.me { border-left: 3px solid var(--gold); padding-left: 6px; }
#log div.foe { border-left: 3px solid var(--foe); padding-left: 6px; }
#hand { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin-top: 8px; }
#hand .card { min-height: 176px; } #hand .card .name { padding-right: 38px; min-height: 32px; display: flex; align-items: center; font-size: .72rem; letter-spacing: -.01em; }
.foehand { display: inline-flex; align-items: center; gap: 6px; }
#foe-hand { font-size: .8rem; color: var(--muted); margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
details { margin-top: 14px; color: var(--muted); font-size: .85rem; }
details p { margin: 6px 0; }
@media (max-width: 1000px) {
  #mid { grid-template-columns: 1fr; } #lanes { order: -1; grid-template-columns: repeat(3, minmax(0, 1fr)); } #lanes { --lane-h: 284px; }
}

/* the versions page: boards of 3 or 1 + 3, and the marks the six rule sets need */
#lanes.b4 { grid-template-columns: 172px repeat(3, 130px); } #lanes.b4 .lane.benchslot { min-height: 150px; align-self: center; } #lanes.b4 .lane.benchslot .card { min-height: 150px; }
.blurb { margin: 0 0 8px; color: var(--muted); font-size: .9rem; }
.card .en { position: absolute; top: 46px; right: 3px; min-width: 40px; text-align: center; font: 700 .8rem var(--body); background: #f2c230; color: #241d14; border: 1px solid #241d14; border-radius: 6px; padding: 1px 4px; }
.card .en small { display: block; font-size: .5rem; text-transform: uppercase; letter-spacing: .08em; }
.card .kw.low { top: 80px; }
.card .cost { z-index: 4; position: absolute; top: 2px; left: 3px; min-width: 22px; height: 22px; border-radius: 6px; background: #4f7cff; color: #fff; font: 700 .85rem var(--body); display: grid; place-items: center; border: 1px solid #fff; }
.card.costed .name { padding-left: 30px; }
.stat { display: inline-flex; align-items: baseline; gap: 4px; white-space: nowrap; } .stat b { font: 700 1.4rem var(--display); }
.stat.hp b { color: var(--foe); } .stat.mana b { color: #4f7cff; }
.slotlabel { text-align: center; color: var(--muted); font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; }
#help { margin: 6px 0 0 18px; padding: 0; } #help li { margin: 4px 0; }
@media (max-width: 1000px) { #lanes.b4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

/* Frontline with a commander: left = status and New match, then my commander; middle = lanes; right = their commander, then the feed */
#table.solo { display: grid; grid-template-columns: minmax(210px, 1fr) auto minmax(210px, 1fr); grid-template-rows: auto 1fr; grid-template-areas: "status board foe" "me board feed"; gap: 10px; margin: 8px 0; }
#status { grid-area: status; } #cmd-0 { grid-area: me; } #board { grid-area: board; display: flex; flex-direction: column; gap: 8px; } #cmd-1 { grid-area: foe; } #feed { grid-area: feed; min-height: 0; }
#table.solo .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.card .tags span.turn { background: var(--gold); color: #fff; font-style: italic; }
.card.rareart { box-shadow: 0 0 0 2px #f2c230, 0 0 10px #f2c230; } .card.rareart .art { filter: saturate(1.5) hue-rotate(-18deg) contrast(1.08); } .card .kind .ra { color: #b8860b; }
.nocmd { display: none; } .cmdbox.glow { box-shadow: 0 0 0 3px var(--gold), 0 0 14px var(--gold); } .cmdbox.hitme { cursor: pointer; }
#table.solo h2 { font: 700 1rem var(--display); margin: 0 0 4px; } #status #new { margin-top: 8px; }
#table.solo #log { max-height: 260px; }
/* no --k here: it would override the k-<colour> class above and every commander would be grey */
.cmdbox { border: 3px solid var(--k, #8a8f98) !important; background: color-mix(in srgb, var(--k, #8a8f98) 20%, var(--panel)) !important; display: flex; flex-direction: column; gap: 6px; }
.cmdbox .head { background: linear-gradient(90deg, var(--k, #8a8f98) 0%, color-mix(in srgb, var(--k, #8a8f98) 78%, transparent) 42%, transparent 100%); color: #fff; text-shadow: 0 1px 2px #000b; border-radius: 7px; padding: 6px 9px 7px; }
.cmdbox .head .who, .cmdbox .head .dk { color: #fff; opacity: .92; } .cmdbox .head .dk b { text-transform: uppercase; letter-spacing: .08em; }
.cmdbox .who { font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.cmdbox .nm { font: 700 1.15rem var(--display); line-height: 1.1; } .cmdbox .dk { font-size: .82rem; color: var(--muted); }
.cmdbox .hp { display: flex; align-items: baseline; gap: 6px; } .cmdbox .hp b { font: 700 3rem var(--display); line-height: 1; color: var(--foe); display: inline-block; } .cmdbox .hp span { font-size: .8rem; color: var(--muted); }
.cmdbox .hpbar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; } .cmdbox .hpbar i { display: block; height: 100%; background: var(--k, var(--foe)); }
.cmdbox .acts { display: flex; flex-direction: column; gap: 5px; }
.cmdbox .acts button { text-align: left; font-size: .8rem; line-height: 1.25; border: 2px solid var(--k); border-radius: 8px; padding: 5px 8px; }
.cmdbox .acts button.on { background: var(--gold); border-color: var(--gold); color: #fff; } .cmdbox .acts button b { font-weight: 700; } .cmdbox .acts button:disabled { border-color: var(--line); }
.cmdbox .line { font-size: .8rem; line-height: 1.3; } .cmdbox .line b { font-weight: 700; } .cmdbox .line.did { outline: 2px solid var(--gold); border-radius: 6px; padding: 2px 5px; }
.cmdbox .price { display: inline-block; min-width: 24px; text-align: center; font-weight: 700; border-radius: 5px; background: var(--foe); color: var(--panel); padding: 0 4px; margin-right: 5px; }
.cmdbox .price.plus { background: var(--good); }
.cmdbox .price.zero { background: var(--muted); }
/* the commander's portrait fills its box behind everything: see-through, tinted with its colour, the figure in the open space on the right */
.cmdbox { position: relative; overflow: hidden; } .cmdbox > * { position: relative; z-index: 1; }
.cmdbox .cmdart { position: absolute; inset: 0; z-index: 0; background-size: cover; background-position: right top; opacity: .42; pointer-events: none; }
.cmdbox .cmdveil { position: absolute; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(90deg, color-mix(in srgb, var(--k, #8a8f98) 22%, var(--panel)) 0%, color-mix(in srgb, color-mix(in srgb, var(--k, #8a8f98) 22%, var(--panel)) 70%, transparent) 45%, color-mix(in srgb, var(--k, #8a8f98) 18%, transparent) 100%); }
.cmdbox .acts button { background: color-mix(in srgb, var(--panel) 82%, transparent); } .cmdbox .acts button.on { background: var(--gold); }
.cmdbox .line { background: color-mix(in srgb, var(--panel) 74%, transparent); border-radius: 6px; padding: 2px 5px; }
.cmdbox .hp b, .cmdbox .hp span { text-shadow: 0 0 4px var(--panel), 0 0 8px var(--panel), 0 1px 0 var(--panel); } .cmdbox .hp span { color: var(--ink); font-weight: 600; }
.cmdbox .line.passive { font-style: italic; }
/* a made fighter (Recruit, Sandbag, Champion): not a card, so it looks like a token, not like a card */
.card.made { border-style: dashed; border-width: 3px; background: repeating-linear-gradient(135deg, var(--panel) 0 10px, var(--slot) 10px 20px); } .card.made .name { font-style: italic; letter-spacing: .04em; text-transform: uppercase; } .card .kw.madetag { background: var(--muted); }
.cmdbox .line.rest { color: var(--muted); border-top: 1px dashed var(--line); padding-top: 5px; } .cmdbox .line.rest.on { color: var(--ink); font-weight: 600; }

<script>
(() => {
const M_match = (() => {
/**
 * The rules as code (docs/01-game-design.md v0.2). Pure functions over plain objects; no chain,
 * no I/O, so the same engine runs in the simulator, a Discord bot and a web page.
 *
 * A match: two players, R rounds. Each round both players draw to a hand of 5, two base cards are
 * dealt face-up from their own deck onto their line (2 slots), then they alternate plays (at most
 * 4 per player per round) until both pass; the clash compares net attack (ATK − opponent DEF).
 * Side slots (4) hold permanent buffs for the rest of the match. Covered line cards are out.
 *
 * Plays: { type: 'line', card, slot }        put a line card on slot 0|1 (covers what is there)
 *        { type: 'equip', card, slot }       equipment on the top card of a slot
 *        { type: 'sideways', card, slot }    any card as +asEquipment equipment on a slot
 *        { type: 'buff', card }              a buff into the next free side slot
 *        { type: 'swap' }                    flip ATK and DEF totals this round, yours or the opponent's per the buff (needs a swap buff in a side slot; once a round)
 *        { type: 'pass' }
 */

// ---- RNG (seeded, so a match replays) ----------------------------------------------------------
function rng(seed = 1) {
  let s = seed >>> 0 || 1;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
function shuffle(arr, rand) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---- state -------------------------------------------------------------------------------------
const HAND = 5;
const MAX_PLAYS = 4;
const SIDE_SLOTS = 4;

/** What goes back to the discard pile: a sideways-played card returns as itself, not as its equipment copy. */
const original = (c) => c.original || c;

function newPlayer(deck, rand) {
  return { deck: shuffle(deck, rand), hand: [], discard: [], line: [[], []], equipment: [[], []], side: [], swapped: false, plays: 0, passed: false, roundsWon: 0 };
}

/**
 * opener: who builds first in round 1 (0, 1, or 'random'); later rounds: the loser of the last round.
 * handicap: 'p2hand4' (the second player draws 4 in round 1) | 'p1plays5' (the opener gets a fifth play in round 1) | null.
 */
function newMatch(deckA, deckB, { rounds = 5, seed = 1, maxExtraRounds = 2, swapTiming = 'clash', opener = 0, handicap = null } = {}) {
  const rand = rng(seed);
  const first = opener === 'random' ? (rand() < 0.5 ? 0 : 1) : opener;
  const m = { rand, rounds, maxExtraRounds, swapTiming, opener: first, handicap, round: 0, players: [newPlayer(deckA, rand), newPlayer(deckB, rand)], turn: 0, phase: 'between', log: [], history: [] };
  return m;
}

/** Permanent side buffs can raise the hand size ('hand') or the plays per round ('plays'). */
const sideBonus = (p, type) => p.side.reduce((n, b) => n + (!b.blanked && b.effect?.type === type ? b.effect.value || 1 : 0), 0);
const handSize = (p, m) => HAND + sideBonus(p, 'hand') + (m && m.round === 1 && m.handicap === 'p2hand4' && p === m.players[1 - m.opener] ? -1 : 0);
const maxPlays = (p, m) => MAX_PLAYS + sideBonus(p, 'plays') + (m && m.round === 1 && m.handicap === 'p1plays5' && p === m.players[m.opener] ? 1 : 0);

function draw(p, n, rand) {
  while (p.hand.length < n) {
    if (!p.deck.length) {
      if (!p.discard.length) return;
      p.deck = shuffle(p.discard, rand);
      p.discard = [];
    }
    p.hand.push(p.deck.pop());
  }
}
function drawOne(p, rand) {
  if (!p.deck.length) {
    if (!p.discard.length) return null;
    p.deck = shuffle(p.discard, rand);
    p.discard = [];
  }
  return p.deck.pop();
}

/** Start the next round: discard hands, clear lines, deal two base cards each, draw to 5. */
function startRound(m) {
  m.round += 1;
  for (const p of m.players) {
    p.discard.push(...p.hand, ...p.line.flat(), ...p.equipment.flat().map(original));
    p.hand = [];
    p.line = [[], []];
    p.equipment = [[], []];
    p.plays = 0;
    p.passed = false;
    p.swapped = false;
    for (const slot of [0, 1]) {
      const c = drawOne(p, m.rand);
      if (c) p.line[slot].push(c);
    }
    draw(p, handSize(p, m), m.rand);
  }

  m.consecutivePasses = 0;
  // the loser of the last round builds first; round 1: the opener
  const last = m.history[m.history.length - 1];
  m.turn = last && last.winner !== null ? 1 - last.winner : m.opener;
  return m;
}

// ---- totals ------------------------------------------------------------------------------------
const top = (p, slot) => p.line[slot][p.line[slot].length - 1] || null;
const isWall = (c) => c && c.effect?.type === 'wall';
const hasDefense = (p) => [0, 1].some((s) => top(p, s)?.kind === 'defense');
const hasWall = (p) => [0, 1].some((s) => isWall(top(p, s)));

function condHolds(when, me, opp) {
  switch (when) {
    case 'opponent.hasWall': return hasWall(opp);
    case 'self.hasDefense': return hasDefense(me);
    case 'self.twoDefenses': return [0, 1].every((s) => top(me, s)?.kind === 'defense');
    case 'self.sideFull': return me.side.length >= SIDE_SLOTS;
    case 'opponent.hasDefense': return hasDefense(opp);
    case 'opponent.sideEmpty': return opp.side.length === 0;
    default: return false;
  }
}

/** The swap buff on a player's side, if any: its target says whose totals it flips ('self' by default, or 'opponent'). */
const swapBuff = (p) => p.side.find((b) => b.effect?.type === 'swap' && !b.blanked) || null;
const hasSwap = (p) => !!swapBuff(p);
const swapTarget = (p) => swapBuff(p)?.effect.target || 'self';

/** Raw ATK and DEF of a player this round (before counters); swap = this player's totals are flipped this round (own choice, or the opponent's swap aimed at them). */
function totals(m, i) {
  const me = m.players[i];
  const opp = m.players[1 - i];
  let atk = 0;
  let def = 0;
  const swap = (!!me.swapped && hasSwap(me) && swapTarget(me) === 'self') !== (!!opp.swapped && hasSwap(opp) && swapTarget(opp) === 'opponent');
  for (const slot of [0, 1]) {
    const c = top(me, slot);
    if (!c) continue;
    atk += c.atk;
    def += c.def;
    if (c.effect?.type === 'condition' && condHolds(c.effect.when, me, opp)) atk += c.effect.value || 0;
    if (!isWall(c)) for (const e of me.equipment[slot]) {
      atk += e.atk;
      def += e.def;
      if (e.effect?.type === 'condition' && condHolds(e.effect.when, me, opp)) atk += e.effect.value || 0;
    }
  }
  for (const b of me.side) {
    if (b.blanked) continue;
    atk += b.atk;
    def += b.def;
    if (b.effect?.type === 'condition' && condHolds(b.effect.when, me, opp)) atk += b.effect.value || 0;
  }
  return { atk, def, swap };
}

/** The clash as it stands, without touching the match: ATK, DEF, net per player and the round winner (null = draw). */
function previewClash(m) {
  const t = [totals(m, 0), totals(m, 1)];
  for (const x of t) if (x.swap) [x.atk, x.def] = [x.def, x.atk];
  const net = [0, 0];
  for (const i of [0, 1]) {
    const me = m.players[i];
    const blocked = Math.min(t[1 - i].atk, t[i].def);
    let counter = 0;
    for (const slot of [0, 1]) {
      const c = top(me, slot);
      if (c?.effect?.type === 'counter') counter += Math.floor(Math.min(blocked, c.def) * (c.effect.value || 0.5));
    }
    net[i] = Math.max(0, t[i].atk + counter - t[1 - i].def);
  }
  const winner = net[0] > net[1] ? 0 : net[1] > net[0] ? 1 : null;
  return { round: m.round, atk: [t[0].atk, t[1].atk], def: [t[0].def, t[1].def], net, winner };
}

/** Resolve the clash: net = ATK − opponent DEF (floor 0); a counter card adds back part of what it blocked itself (capped at its own DEF). */
function resolveRound(m) {
  const result = previewClash(m);
  if (result.winner !== null) m.players[result.winner].roundsWon += 1;
  m.history.push(result);
  m.phase = 'between';
  return result;
}

// ---- plays -------------------------------------------------------------------------------------
function legalPlays(m, i) {
  const me = m.players[i];
  if (m.phase !== 'build' || m.turn !== i) return [];
  const plays = [{ type: 'pass' }];
  if (me.plays >= maxPlays(me, m)) return plays;
  if (m.swapTiming === 'build' && hasSwap(me) && !me.swapped) plays.push({ type: 'swap' });
  for (const card of me.hand) {
    if (card.kind === 'attack' || card.kind === 'defense') for (const slot of [0, 1]) plays.push({ type: 'line', card, slot });
    if (card.kind === 'equipment') for (const slot of [0, 1]) if (top(me, slot)) plays.push({ type: 'equip', card, slot });

const THEME = {

  subtitle: 'playtest · v0.11',
  hero: 'Rig',                // what the one Rig each player builds on is called (the word "commander" is avoided on purpose)
  design: 'poster',            // card face: spine, hud, poster or corners (web/card.js)
  // (card) => image address for that card's art, or null for the drawn stand-in (web/art.js). Rigs use the Brozo chosen in tools/art/rig-art.json (web/assets/rigs); any card with a picture in web/assets/art named after its id uses that.
  art: (c) => (typeof ASSETS !== 'undefined' && ASSETS.rigs ? ASSETS.rigs[c.id] || null : null),
  factions: {

/* Anim: a small animation layer for pages that redraw themselves with innerHTML.

   The page keeps drawing the whole table from the match state. Anim makes that look continuous:
     1. give every thing that can move a stable `data-key` (a card's uid, 'rig-0', 'deck-1' ...)
     2. const snap = Anim.snapshot()      before the state changes
     3. change the state, redraw
     4. await Anim.flip(snap, { from, to })
        - a key that is in both pictures glides from its old place to its new one (hand → slot → discard)
        - a new key flies in from `from(key)` (an element or a key, e.g. the deck)
        - a key that is gone flies to `to(key)` and fades; return undefined to let it just vanish
   On top of that there are one-shot effects aimed at an element or key: lunge, shake, pulse, flash, float (a number
   that rises and fades). All timings go through Anim.cfg.speed (0 = no animation) and stop when the system asks for
   reduced motion. Nothing here knows about the game. */
const Anim = (() => {
  const cfg = { speed: 1 };
  const still = () => !cfg.speed || (typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const ms = (n) => (still() ? 0 : n / cfg.speed);
  const wait = (n) => new Promise((r) => setTimeout(r, ms(n)));
  const find = (x) => (!x ? null : typeof x === 'string' ? document.querySelector(`[data-key="${x}"]`) : x);
  const rectOf = (x) => { const e = find(x); return e ? e.getBoundingClientRect() : null; };
  // an animation is over when it says so or when its time is up: in a hidden tab animations do not run, the game still must
  const done = (a) => Promise.race([a.finished.catch(() => {}), new Promise((r) => setTimeout(r, (a.effect ? a.effect.getTiming().duration : 0) + 120))]);
  const EASE = 'cubic-bezier(.2,.8,.2,1)';

  const css = document.createElement('style');
  css.textContent = `
.anim-ghost { position: fixed; margin: 0; pointer-events: none; z-index: 40; }
.anim-float { position: fixed; z-index: 50; pointer-events: none; font: 700 1.5rem var(--display, serif); text-shadow: 0 1px 0 var(--panel, #fff), 0 0 6px var(--panel, #fff); transform: translate(-50%, -50%); }
.anim-float.dmg { color: var(--foe, #b00); } .anim-float.heal { color: var(--good, #080); } .anim-float.gain { color: var(--gold, #a80); }`;
  document.head.appendChild(css);

  function snapshot() {
    const map = new Map();
    document.querySelectorAll('[data-key]').forEach((e) => map.set(e.dataset.key, { rect: e.getBoundingClientRect(), node: e.cloneNode(true) }));
    return map;
  }
  function ghost(v, target, dur) {
    const g = v.node, a = v.rect;
    g.classList.add('anim-ghost');
    g.removeAttribute('data-key'); g.removeAttribute('data-i');
    Object.assign(g.style, { left: `${a.left}px`, top: `${a.top}px`, width: `${a.width}px`, height: `${a.height}px` });
    document.body.appendChild(g);
    const end = target ? `translate(${target.left + target.width / 2 - a.left - a.width / 2}px, ${target.top + target.height / 2 - a.top - a.height / 2}px) scale(.5)` : 'scale(.8)';
    return done(g.animate([{ transform: 'none', opacity: 1 }, { transform: end, opacity: 0 }], { duration: ms(dur), easing: 'ease-in' })).then(() => g.remove());
  }
  function flip(before, { from = () => null, to = () => undefined, dur = 360 } = {}) {
    if (still()) return Promise.resolve();
    const jobs = [], now = new Set();
    document.querySelectorAll('[data-key]').forEach((e) => {
      const k = e.dataset.key;
      now.add(k);

/* Tips: one-sentence explanations for the symbols, badges and bare numbers of the Charge pages (v13 and pvp).

   Tips.at(text) gives an element three attributes: title (hover), aria-label (screen readers) and data-tip (touch).
   Where hover does not exist the same text is reached by touch:
     - a tap on an explained thing that does nothing else (a score, a dot, a deck count, an empty bench place) shows it;
     - a long press (450 ms without moving) on anything explained shows it too: that is the way for things a tap already
       uses, such as a card, a bot or a button. The click that would follow the press is dropped.
   The explanation is a small box by the element; the next tap anywhere closes it.

const Tips = (() => {

  const kills = (n) => `${n} ${n === 1 ? 'kill' : 'kills'}`;
  const low = (s) => s[0].toLowerCase() + s.slice(1);
  const worthOf = (o, c) => (o.worth ? o.worth[c.rarity || 'common'] || 1 : 1);
  const times = (n) => (n === 1 ? 'Once' : `${n} times`);

  // ---- the texts ---------------------------------------------------------------------------------------------------
  const T = {
    energy: (b) => `Energy ${b.e}${b.max !== undefined && b.e !== b.max ? ` (it charges up to ${b.max})` : ''}: hits take it away, its big attack is paid with it, and at 0 the bot is destroyed.`,
    cardEnergy: (c) => `Energy: it arrives with ${c.energy} and charges back up to that; at 0 it is destroyed.`,
    power: (c) => `Power card: ${low(E.describe(c)[0])}`,
    /** scorer: 'You score' / 'The bot scores' */
    kill: (o, b, scorer) => `${scorer} ${kills(worthOf(o, b))} when this ${b.rarity || 'common'} bot is destroyed; the first to ${o.prizes} wins.`,
    shield: (b) => `Shielded: ${E.EFFECT.shield().split(': ')[1].replace(/\.$/, '')}${E.abil(b, 'aegis') ? ', and the shield comes back at the start of each of its owner\'s turns' : ''}.`,
    rarity: (o, c) => `${(c.rarity || 'common')[0].toUpperCase() + (c.rarity || 'common').slice(1)} bot: destroying it counts ${kills(worthOf(o, c))} of the ${o.prizes} that win.`,
    gear: (g) => `${g.name} (gear, stays on this bot): ${low(E.GEAR[g.gear])}`,
    ability: (b) => `Ability of this bot: ${low(E.abilityText(b))}`,
    state: (m, b, s) => (s === 'just arrived' ? 'It arrived this turn, so it cannot act until its owner\'s next turn.' : s === 'done' ? 'It has done its one thing this turn.' : `It has not acted: if it still has not when the turn ends, it charges ${E.chargeOf(m, b)} energy.`),
    free: (b) => `Free attack: costs nothing and takes ${E.strikeOf(b)} energy from ${E.farFree(b) ? 'any bot of the other side, also when made from the bench' : 'the bot opposite (any front bot when nothing is opposite)'}.`,
    big: (b, o = {}) => { const mv = E.bigOf(b); return `Big attack ${mv.name}: the bot pays ${mv.pay} of its own energy and takes ${mv.hit} from ${mv.ranged ? 'any bot of the other side, bench included' : 'the bot opposite (any front bot when nothing is opposite)'}${o.bigCooldown ? `; after it the big attack rests for ${o.bigCooldown === 2 ? 'one turn' : `${o.bigCooldown - 1} turns`} of its owner` : ''}.`; },
    /** The big attack on its rest (trial rule): b.cool counts its owner's turns still to wait, this one included. */
    cool: (b, ownTurn) => (ownTurn ? `Its big attack rests this turn${b.cool > 1 ? ' and the next' : ''}; the free attack and charging are still open.` : `Its big attack was used: it rests on its owner's next ${b.cool > 2 ? `${b.cool - 1} turns` : 'turn'}.`),
    /** The commander chip (trial rule). who: 'Your' / "The bot's" */
    cmd: (o, c, who) => `${who} ${c.color} commander, not in a lane${c.kind === 'walker' || c.kind === 'conductor' ? '' : ' and never attacked'}: ${E.COMMANDERS[c.kind](o).replace(/^./, (x) => x.toLowerCase())}`,
    feed: () => 'Its one thing this turn instead of charging: it gives 1 of its energy to the bot in front of it.',
    bench: () => 'Bench: a bot here cannot attack or be hit by normal attacks; each turn it gives 1 energy to the bot in front or charges, and it steps up when that bot is destroyed.',
    benchBot: () => 'On the bench: it cannot be hit by normal attacks, gives 1 energy to the bot in front or charges, and steps up when that bot is destroyed.',
    emptyLane: (o) => (o.benchOnly ? 'Empty lane: the bench bot behind it walks up at the start of its owner\'s next turn; until then the bot opposite may hit any front bot.' : 'Empty lane: a bot card can be played here, and the bot opposite may hit any front bot.'),
    lane: (k) => `Lane ${k + 1}: the two front bots in it face each other, and a bot's attack hits the bot opposite.`,
    /** who: 'You have' / 'The bot has' */
    score: (o, who, got) => `${who} ${got} of the ${o.prizes} kills that win the match; a destroyed bot counts ${E.RARITY.map((r) => `${o.worth ? o.worth[r] : 1} (${r})`).join(', ')}.`,
    dot: (o, k, got) => `Kill ${k + 1} of ${o.prizes}: ${k < got ? 'scored' : 'still to score'}.`,
    deck: (o, n) => `Deck: ${n} ${n === 1 ? 'card' : 'cards'} left to draw; ${o.draws} are drawn at the start of each turn.`,
    scrap: (n) => `Scrap pile: ${n} ${n === 1 ? 'card' : 'cards'} destroyed, played or discarded; click to look through it.`,
    /** who: 'The bot holds' */
    foeHand: (o, who, n) => `${who} ${n} ${n === 1 ? 'card' : 'cards'}; a hand over ${o.maxHand} is discarded down at the end of its owner's turn.`,
    kind: (o, c) => ({
      bot: `Bot card: it goes ${o.benchOnly ? 'onto a bench place' : 'into an empty lane or onto a bench place'} and cannot act the turn it arrives; one bot card a turn.`,
      power: 'Power card: it gives one of your bots energy, also over its maximum; one power card a turn.',
      gear: 'Gear card: it is fitted to one of your bots that has no gear and stays on it; one gear card a turn.',
      instant: 'Instant: its effect happens once and the card goes to the scrap pile; one instant a turn.',
    }[c.kind]),
    chip: (name, used) => `You may play one ${name.toLowerCase()} card each turn${used ? ': already played this turn' : ''}.`,
    cycle: (o, used) => `${times(o.cycle)} a turn you may discard a card from your hand to draw one${used ? ': already done this turn' : ''}.`,
    end: (o) => `End your turn: every bot of yours that did nothing charges ${o.charge} energy, up to its maximum.`,
    eye: (b) => (E.farFree(b) ? `Teal eye: its free attack reaches any bot, also from the bench${b.move && b.move.ranged ? '; so does its big attack' : ''}.` : 'Orange eye: its big attack reaches any bot; its free attack does not.'),
  };

  // ---- two small pictures that both pages draw the same way --------------------------------------------------------------
  /** The eye beside a bot's name: it can hit any bot of the other side. Teal with a filled iris = its free attack does
      (Scope gear; it comes and goes with the gear). Orange with a ring iris = only its big attack does. */
  const EYE_PATH = 'M1.5 7C4.3 2.9 8 1.4 12 1.4s7.7 1.5 10.5 5.6c-2.8 4.1-6.5 5.6-10.5 5.6S4.3 11.1 1.5 7z';
  function eye(b) {
    if (b.kind !== 'bot') return '';
    const free = E.farFree(b), big = !!(b.move && b.move.ranged);
    if (!free && !big) return '';

  }
  /** The diamond beside the name of a bot that is not common. */
  const gem = (o, c) => (c.rarity && c.rarity !== 'common' ? `<i class="gem g-${c.rarity}" role="img"${at(T.rarity(o, c))}></i>` : '');

  // ---- the box --------------------------------------------------------------------------------------------------------
  const css = document.createElement('style');
  css.textContent = `
.tip-pop { position: fixed; z-index: 80; max-width: 270px; background: #10151c; color: #f4efe2; border: 1px solid #f4efe2; font: 500 .82rem/1.35 var(--body, sans-serif); padding: 7px 10px; border-radius: 8px; box-shadow: 0 6px 18px rgba(0, 0, 0, .5); pointer-events: none; }
[data-tip] { -webkit-touch-callout: none; }
.eye { display: inline-flex; vertical-align: -3px; margin-right: 4px; background: #10151c; border-radius: 8px; padding: 2px 3px; cursor: help; }
.eye svg { width: 20px; height: 12px; display: block; }
.eye .lid { fill: none; stroke-width: 2; stroke-linejoin: round; }
.eye-free { box-shadow: 0 0 0 1.5px #2ee6d6; } .eye-free .lid { stroke: #2ee6d6; } .eye-free .iris { fill: #2ee6d6; }
.eye-big { box-shadow: 0 0 0 1.5px #ff9a3d; } .eye-big .lid { stroke: #ff9a3d; } .eye-big .iris { fill: none; stroke: #ff9a3d; stroke-width: 1.8; }`;
  document.head.appendChild(css);

  let pop = null, timer = null, held = false, down = null, downEl = null, downType = 'mouse', away = false, synthAt = 0;
  /* tapThrough (set by a page): on touch, a long press on a button shows its explanation and lifting the finger in place

  const api = { at, T, eye, gem, kills, onHold: null, tapThrough: false, show, hide };
  function hide() { if (pop) { pop.remove(); pop = null; } }
  function show(el) {

    pop.className = 'tip-pop'; pop.setAttribute('role', 'tooltip'); pop.textContent = el.dataset.tip;
    document.body.appendChild(pop);

    const top = r.top - h - 8 >= 6 ? r.top - h - 8 : Math.min(window.innerHeight - h - 6, r.bottom + 8);
    Object.assign(pop.style, { left: `${Math.max(6, Math.min(window.innerWidth - w - 6, r.left + r.width / 2 - w / 2))}px`, top: `${Math.max(6, top)}px` });
  }
  const stop = () => { clearTimeout(timer); timer = null; };
  /** Does a tap on this element (or on what it sits in) already do something? Then only a long press explains it. */
  const busyWith = (el) => !!el.closest('button, select, input, label, a, summary, [data-on]');
  document.addEventListener('pointerdown', (e) => {
    hide(); stop(); held = false;
    const el = e.isTrusted && e.target.closest ? e.target.closest('[data-tip]') : null;   // a script's own clicks (the self-test) never wait
    if (!el) return;
    down = { x: e.clientX, y: e.clientY }; downEl = e.target; downType = e.pointerType || 'mouse'; away = false;
    timer = setTimeout(() => { timer = null; held = true; if (api.onHold) api.onHold(); show(el); }, 450);
  }, true);
  document.addEventListener('pointermove', (e) => { if (held && down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 12) away = true; if (timer && down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) stop(); }, true);
  document.addEventListener('pointerup', () => {

    const b = downEl.closest('button, [data-on]');

})();

/* The AI opponent on the Thane page (docs/ai-opponent.md). Adds the "Opponent play" menu (computer / AI: Gemini /
   AI: Claude), keeps the passcode for this tab, and asks /api/thane-ai (a Cloudflare function next to the page, or
   tools/ai/dev-server.mjs on localhost) for the opponent's turn plan. The engine side is engine/ai-view.mjs (M_ai_view).
   app-versions.js calls ThaneAI.on() and ThaneAI.move(m, fallback). Any failure: the code player plays that turn. */
const ThaneAI = (() => {
  const A = typeof M_ai_view !== 'undefined' ? M_ai_view : null, local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const store = { get: (k) => { try { return sessionStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch { /* private mode: this visit only */ } } };
  const self = { mode: 'computer', thinking: false, st: null, failedTurn: -1, onNote: null };
  const q = new URLSearchParams(location.search);
  if (!q.has('selftest')) self.mode = store.get('thane-ai-mode') || 'computer';
  if (['computer', 'gemini', 'claude'].includes(q.get('opponent'))) self.mode = q.get('opponent');   // ?opponent=claude (tests; the passcode is still needed)
  const passcode = () => (local ? 'local' : store.get('thane-ai-pass'));
  self.on = () => !!A && self.mode !== 'computer';
  self.reset = () => { self.st = A ? A.newTurnState() : null; self.failedTurn = -1; };
  self.set = (mode) => {
    if (mode !== 'computer' && !passcode()) { const p = window.prompt('Passcode for the AI opponent:'); if (!p) mode = 'computer'; else store.set('thane-ai-pass', p.trim()); }
    self.mode = mode; store.set('thane-ai-mode', mode === 'computer' ? null : mode);
    for (const el of document.querySelectorAll('.ai-opp')) el.value = mode;
    self.reset();
  };
  async function ask({ state, actions }) {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 20000);
    try {
      const r = await fetch('/api/thane-ai', { method: 'POST', signal: ctl.signal, headers: { 'content-type': 'application/json', 'x-thane-passcode': passcode() || '' }, body: JSON.stringify({ model: self.mode, state, actions }) });
      const j = await r.json().catch(() => ({}));
      if (r.status === 401) store.set('thane-ai-pass', null);   // a wrong passcode is asked again next time
      if (!r.ok) throw new Error(j.error || `status ${r.status}`);
      return j;
    } finally { clearTimeout(t); }
  }
  /** The opponent's next move: { a, by, note } — note is a feed line to show once a turn when the AI could not play. */
  self.move = async (m, fallback) => {
    if (!self.st) self.reset();
    const asking = !m.ask.length && m.actor === m.turn && !self.st.plan.length;
    self.thinking = asking;
    if (asking && self.onThink) self.onThink();
    try {
      const r = await A.decide(m, self.st, ask, fallback);
      if (r.by === 'code' && r.note === 'error' && self.failedTurn !== m.turnNo) { self.failedTurn = m.turnNo; r.feed = 'The AI did not answer; the computer played this turn.'; }
      return r;
    } finally { self.thinking = false; }
  }
  // the menu: one select in the header (the phone menu shows the same header)
  const host = document.getElementById('speed') && document.getElementById('speed').closest('label');
  if (A && host) {
    const label = document.createElement('label'); label.className = 'label'; label.title = 'Who plays the opponent: the built-in computer player, or a language model (needs a passcode).';
    label.innerHTML = 'Opponent play <select class="ai-opp" id="ai-opp"><option value="computer">computer</option><option value="gemini">AI: Gemini</option><option value="claude">AI: Claude</option></select>';
    host.parentNode.insertBefore(label, host);
    label.querySelector('select').value = self.mode;
    label.querySelector('select').addEventListener('change', (e) => self.set(e.target.value));
  }
  return self;
})();

/* Six alternative rule sets on one page (engine/versions.mjs, docs/versions-2026-11.md). You are player 0, the computer

const V = M_versions;

const $ = (id) => document.getElementById(id);

const ME = 0, BOT = 1;
const qs = new URLSearchParams(location.search);

const BLURB = {
  arena: 'One active bot and a bench, one energy a turn, knock-outs score. Modelled on the short pocket format of the monster-collecting card games.',
  duel: 'Twenty health each, mana that grows, bots with attack and defence, and you choose whether to block. Modelled on the classic mana-and-blockers card game.',
  frontline: 'Mix 1: three lanes facing each other and kills to win, paid for with mana. Worth trying because it is today\'s lane game with prices instead of "one card of each type".',
  warchest: 'Mix 2: the Arena board (one active bot, a bench) run on mana instead of energy on bots. Worth trying because it keeps the duel of two bots but lets you choose each turn between cards and big attacks.',
  bodyguard: 'Mix 3: Duel\'s fight (20 health, choose to block, damage wiped each turn) with energy on bots instead of mana. Worth trying because cards are free, so the only question each turn is attack or hold back.',
  champion: 'Mix 4: one active bot whose damage lasts, but the target is the other player\'s 20 health and their bot may step in the way. Worth trying because every attack asks the defender: my bot or me?',

const SOLO = !!$('cmd-0');   // the Frontline page: one version, with commanders, in its own layout

const layoutSaved = () => { const q = qs.get('layout'); if (q === 'phone' || q === 'desktop') return q; try { return localStorage.getItem('thane-layout'); } catch { return null; } };

    acts = SOLO ? '' : `<button class="primary" ${on(start)}>New match</button>`;
  } else if (m.actor !== ME || AUTO) { h = "The opponent's turn"; info = typeof ThaneAI !== 'undefined' && ThaneAI.thinking ? 'thinking…' : '…'; }
  else if (q && q.kind === 'promote') { h = 'Your active bot is gone'; info = 'Choose the bench bot that takes its place.'; }
  else if (q && q.kind === 'block') {
    const att = V.botAt(m, m.pending);
    h = `${esc(att.name)} attacks you for ${m.pending.n}`; info = 'Block with one of your bots (the button on the bot), or take it.';
    acts = btn(`Do not block: lose ${m.pending.n} health`, { type: 'block', slot: null }, 'primary');
  } else if (q && q.kind === 'respond') {
    const att = V.botAt(m, m.pending);
    h = `${esc(att.name)} attacks for ${m.pending.n}`; info = `You kept ${m.players[ME].mana} mana: you may answer with one instant from your hand (click it, then its target), or let the attack go on.`;
    acts = btn('No answer', { type: 'pass' }, 'primary');
  } else if (q && q.kind === 'trim') {
    h = `Discard down to ${V.handMaxOf(m, ME)} cards`; info = `You hold ${m.players[ME].hand.length}. Click a card in your hand to discard it.`;
  } else if (trim) {
    const need = m.players[ME].hand.length - V.handMaxOf(m, ME), left = need - trim.size;
    h = `End of turn: discard ${need} ${need === 1 ? 'card' : 'cards'}`; info = `You may hold ${V.handMaxOf(m, ME)} cards when your turn ends. Click the ${need === 1 ? 'card' : 'cards'} in your hand to give up: <b>${left} to go</b>. The turn ends when you have chosen.`;
    acts = `<button ${on(() => { trim = null; render(); })}>Back to my turn</button>`;
  } else {
    h = `Your turn ${Math.ceil(m.turnNo / 2)}`;
    const c = sel !== null ? m.players[ME].hand[sel] : null, plain = c && list.find((a) => a.type === 'play' && a.hand === sel && !a.target);
    info = c ? `<b>${esc(c.name)}</b>: ${list.some((a) => a.type === 'play' && a.hand === sel) ? (plain ? 'click it again or press Play.' : 'click a glowing place.') : '<span class="why">cannot be played now.</span>'}` : m.turnNo === 1 ? 'Play cards. <span class="why">No attacks on the first turn.</span>' : 'Play cards and use the buttons on your bots.';
    if (plain) acts += btn(`Play ${esc(c.name)}`, plain, 'primary');
    if (c && o().mulligan === 'cycle') {   // once a turn: discard the chosen card to draw one (as in the Charge game)
      const cyc = list.find((a) => a.type === 'cycle' && a.hand === sel), t = 'Once a turn you may discard a card from your hand to draw one. This is not the end-of-turn discard.';
      acts += cyc ? btn('Discard it, draw a card (once a turn)', cyc, '', t) : `<button disabled${tipBtn(`${m.cycled ? 'Already done this turn' : 'Your deck is empty'}. ${t}`)}>Discard it, draw a card${m.cycled ? ' (done this turn)' : ''}</button>`;
    }
    const over = V.handMaxOf(m, ME) && m.players[ME].hand.length > V.handMaxOf(m, ME);
    if (over) acts += `<button class="go ${list.some((a) => a.type !== 'end' && a.type !== 'cycle') ? '' : 'primary'}" ${on(() => { trim = new Set(); sel = null; cmdAim = null; atkAim = null; render(); })}${tipBtn(`Ends your turn. You hold more than ${V.handMaxOf(m, ME)} cards, so you first choose which to discard.`)}>End turn</button>`;
    else acts += btn('End turn', { type: 'end' }, list.some((a) => a.type !== 'end') ? '' : 'primary', o().resource === 'pool' ? 'Ends your turn. Mana you keep can pay for one instant when you are attacked.' : 'Ends your turn.');
  }
  if (q && sel !== null && q.kind === 'respond') { const c = m.players[ME].hand[sel], plain = c && list.find((a) => a.type === 'play' && a.hand === sel && !a.target); if (plain) acts = btn(`Play ${esc(c.name)}`, plain, 'primary') + acts; }
  E('tray-h').innerHTML = h; E('info').innerHTML = info; E('actions').innerHTML = acts;
}
function render() {
  reg = []; noteHeld();
  if (PHONE) return renderPhone(opts());
  const list = opts(), v = o(), n = v.board === 'bench' ? 4 : 3, ks = Array.from({ length: n }, (_, k) => k);
  $('score-1').innerHTML = scoreHtml(BOT); $('score-0').innerHTML = scoreHtml(ME);
  if (SOLO) for (const i of [ME, BOT]) { const c = m.players[i].cmd, hit = c && i === BOT ? list.filter((a) => a.at === 'cmd' && (!atkAim || (a.slot === atkAim.slot && a.kind === atkAim.kind))) : []; $(`cmd-${i}`).innerHTML = c ? cmdHtml(i, list, hit) : ''; $(`cmd-${i}`).className = c ? `panel cmdbox k-${c.color}${hit.length ? ' glow' : ''}${hit.length ? ' hitme' : ''}` : 'nocmd';
    // a glowing Thane with one attack waiting on it: a click anywhere on the box makes that attack (its buttons keep their own clicks)
    $(`cmd-${i}`).onclick = hit.length === 1 ? (e) => { if (!e.target.closest('button')) act(hit[0]); } : hit.length > 1 ? (e) => { if (!e.target.closest('button')) { thaneAim = !thaneAim; sel = null; cmdAim = null; atkAim = null; render(); } } : null; }
  $('lanes').className = `b${n}`;
  $('lanes').innerHTML = ks.map((k) => slotHtml(BOT, k, list)).join('') + ks.map((k) => `<div class="slotlabel"${tip(v.board === 'bench' ? (k ? TIP.bench() : TIP.active()) : TIP.slot(k))}>${v.board === 'bench' ? (k ? 'bench' : 'active') : v.block === 'fixed' ? `lane ${k + 1}` : ''}</div>`).join('') + ks.map((k) => slotHtml(ME, k, list)).join('');
  $('hand').innerHTML = m.players[ME].hand.map((c, h) => cardHtml(c, h, list)).join('');
  tray(list);
  $('pileview').innerHTML = pile === null ? '' : pileHtml(pile === ME ? 'Your scrap pile' : "The opponent's scrap pile", m.players[pile].scrap);
  if (SOLO) reword($('table')), reword($('hand')), reword($('pileview'));
  $('log').innerHTML = log.slice(0, 60).map((l, k) => `<div class="${k < fresh ? 'new' : ''} ${l.who === ME ? 'me' : l.who === BOT ? 'foe' : ''}">${esc(l.text)}</div>`).join('');
}

// ---- playing ---------------------------------------------------------------------------------------------------------
const vitals = () => { const x = new Map(); m.players.forEach((p, i) => { p.bots.forEach((b, k) => { if (b) x.set(b.card.uid, { left: V.leftOf(b), slot: `slot-${i}-${k}` }); }); x.set(`hp-${i}`, { left: m.o.win === 'commander' ? p.cmd.health : m.o.win === 'health' ? p.health : p.kills }); }); return x; };
async function step(a) {
  const game = m;   // a new match may be started while this action is still being shown: then it is dropped
  busy = true; fresh = 0; sel = null; cmdAim = null; atkAim = null; thaneAim = false; sheet = null;
  // an attack is shown before it lands: the fighter jumps at the card it hits, or at the other Thane's box
  if (a.type === 'attack') {
    const i = m.actor, me = m.players[i].bots[a.slot], foe = m.players[1 - i];
    const t = a.at === 'cmd' ? E(`cmd-${1 - i}`) : foe.bots[a.at ?? a.slot] || foe.bots[0];
    if (me && t) await Anim.lunge(me.card.uid, t.card ? t.card.uid : t, a.kind === 'big' ? 420 : 340, 0.7);
    // damage that carries past the fighter it destroys (Punch Through, Ram, Momentum Rig, Breakthrough): a second jump, at the Thane
    if (me && a.at !== 'cmd') { const c = V.clone(m); V.apply(c, a, false); if (c.log.some((l) => /carries \d+ through|keeps going/.test(l.text)) && E(`cmd-${1 - i}`)) await Anim.lunge(me.card.uid, E(`cmd-${1 - i}`), 300, 0.6); }
  }
  const usedCmd = a.type === 'cmd' ? m.actor : null;
  const snap = Anim.snapshot(), was = vitals();
  if (m !== game) return;
  if (!V.options(m).some((x) => JSON.stringify(x) === JSON.stringify(a))) { busy = false; render(); return next(); }   // a stale click: nothing happens
  V.apply(m, a);
  pull(); render();
  const jobs = [Anim.flip(snap)], now = vitals();
  if (usedCmd !== null && E(`cmd-${usedCmd}`)) jobs.push(Anim.pulse(E(`cmd-${usedCmd}`), 600));
  for (const [k, w] of was) {
    const x = now.get(k);
    if (!x) { jobs.push(Anim.float(w.slot, 'destroyed', 'dmg', 1100), Anim.shake(w.slot)); continue; }
    const d = x.left - w.left;
    if (d) jobs.push(Anim.float(k, d > 0 ? `+${d}` : `−${-d}`, d > 0 && !/^hp/.test(k) ? 'gain' : 'dmg'), d < 0 ? Anim.shake(k) : Anim.pulse(k));
  }
  await Promise.all(jobs);
  busy = false; next();
}
function act(a) { if (!busy) step(a); }
function next() {
  if (m.winner !== null) { render(); return; }
  if (m.actor === BOT && !AUTO && typeof ThaneAI !== 'undefined' && ThaneAI.on()) {   // the AI opponent (web/ai.js): its plan, or the code player on any failure
    const game = m; busy = true; ThaneAI.onThink = render;
    ThaneAI.move(m, greedyBot).catch(() => ({ a: greedyBot(m), feed: 'The AI did not answer; the computer played this turn.' })).then((r) => { if (m !== game) return; if (r.feed) { note(r.feed, null); render(); } return Anim.wait(350).then(() => step(r.a)); });
    return;
  }
  if (m.actor === BOT || AUTO) { busy = true; Anim.wait(AUTO ? 150 : 550).then(() => step(greedyBot(m))); }
}

// ---- page ------------------------------------------------------------------------------------------------------------
$('title').textContent = SOLO ? V.WORDS.leader : `${THEME.title} · six versions`;
if (SOLO) { document.title = V.WORDS.leader; reword(document.querySelector('header')); }
if (!SOLO) $('ver').innerHTML = Object.entries(V.VERSIONS).map(([k, v], n) => `<option value="${k}">${n < 2 ? 'AB'[n] : `Mix ${n - 1}`}: ${v.name}</option>`).join('');
if (!SOLO) $('ver').value = ver;
if (!SOLO) $('ver').addEventListener('change', (e) => { ver = e.target.value; history.replaceState(null, '', `?v=${ver}`); start(); });
for (const id of ['me-color', 'bot-color']) {
  $(id).innerHTML = ['random', ...COLORS].map((c) => `<option value="${c}">${c === 'random' ? 'random colour' : fac(c).name}</option>`).join('');
  if (SOLO && id === 'me-color') $(id).innerHTML = '<option value="random">a random Thane</option>' + `<optgroup label="Silly decks">${Object.entries(V.COMMANDERS).filter(([, t]) => t.set).map(([k, t]) => `<option value="${k}">${esc(t.name)} · ${esc(t.deck)}</option>`).join('')}</optgroup>` + COLORS.map((c) => `<optgroup label="${fac(c).name}">${Object.entries(V.COMMANDERS).filter(([, t]) => t.color === c && !t.set).map(([k, t]) => `<option value="${k}">${esc(t.name)} · ${esc(t.deck)}</option>`).join('')}</optgroup>`).join('');
  if (SOLO && id === 'bot-color') $(id).parentNode.style.display = 'none';   // the opponent's Thane is always a random one
  if (SOLO && id === 'me-color') $(id).value = settings.me;
  $(id).addEventListener('change', (e) => { settings[id === 'me-color' ? 'me' : 'bot'] = e.target.value; start(); });
}
$('speed').addEventListener('change', (e) => { Anim.cfg.speed = Number(e.target.value); });
$('new').addEventListener('click', start);
if (SOLO && $('layout')) {
  const apply = () => { document.body.classList.toggle('phone', PHONE); document.body.classList.remove('show-menu'); sheet = null; };
  $('layout').value = layoutSaved() || 'auto'; apply();
  $('layout').addEventListener('change', (e) => { const v = e.target.value; try { if (v === 'auto') localStorage.removeItem('thane-layout'); else localStorage.setItem('thane-layout', v); } catch { /* private mode: the choice holds for this visit */ } PHONE = v === 'auto' ? layoutAuto() : v === 'phone'; apply(); render(); });
  $('menu-close').addEventListener('click', () => document.body.classList.remove('show-menu'));
  $('p-new').addEventListener('click', start);
}
if (SOLO) for (const k of ['abilities', 'commander']) { $(`opt-${k}`).checked = four[k]; $(`opt-${k}`).addEventListener('change', (e) => { four[k] = e.target.checked; history.replaceState(null, '', `?abilities=${four.abilities ? 1 : 0}&commander=${four.commander ? 1 : 0}`); start(); }); }
start();

/* ?dev=1: lets a test script reach the match and redraw (window.__thane.m, .render), to set up a table by hand. */
if (qs.get('dev') === '1') window.__thane = { get m() { return m; }, render, options: () => V.options(m), get busy() { return busy; } };
/* ?selftest=1: clicks at random among the things that can be clicked now (hand cards, glowing places, the buttons on
   bots and in the panel), so every path a person has is used. The result is in the page title. */
if (qs.get('selftest') === '1') {
  const errors = []; let clicks = 0, matches = 0, offered = 0, direct = 0, offerTurn = null; const want = Number(qs.get('matches') || 2);
  window.addEventListener('error', (e) => errors.push(`${e.message} (line ${e.lineno})`));
  window.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason && e.reason.message)));
  Anim.cfg.speed = 0;
  const tick = () => {
    document.title = `selftest ${matches >= want ? 'done' : 'running'}: ${SOLO ? `frontline abilities ${four.abilities} commander ${four.commander}` : ver}, ${matches} matches, winner ${m.winner} by ${m.how}, ${clicks} clicks, turn ${m.turnNo}, ${SOLO ? `direct hits ${direct} (on offer in ${offered} turns), ` : ''}errors ${errors.length} ${errors.slice(0, 2).join(' | ')}`;
    if (errors.length || matches >= want) return;
    if (m.winner !== null) { direct += m.log.filter((l) => l.who === ME && /through the open lane/.test(l.text)).length; matches++; if (matches >= want && SOLO && offered >= 5 && !direct) errors.push(`a hit on their ${V.WORDS.leader} was on offer ${offered} times and no click ever made one`); if (matches < want) start(); return setTimeout(tick, 5); }
    if (!busy && m.actor === ME) {
      // an open lane must always have a control: a button on the fighter, on their Thane box, or (phone) their glowing portrait
      if (SOLO && !asked() && !trim && !sheet && !atkAim && !cmdAim && !thaneAim && sel === null && V.options(m).some((a) => a.type === 'attack' && a.at === 'cmd')) { if (offerTurn !== `${matches}-${m.turnNo}`) { offerTurn = `${matches}-${m.turnNo}`; offered++; } if (!document.querySelector('[data-direct].go')) errors.push(`turn ${m.turnNo}: a hit on their ${V.WORDS.leader} is on offer and the page has no control for it`); }
      const all = [...document.querySelectorAll('.go')], end = all.filter((e) => /^End turn|^No answer|^Do not block/.test(e.textContent)), rest = all.filter((e) => !end.includes(e));
      const way = [...document.querySelectorAll('[data-direct].go')];   // half the time an open lane is used, as a person would
      const pick = way.length && Math.random() < 0.5 ? way[Math.floor(Math.random() * way.length)] : rest.length && Math.random() < 0.85 ? rest[Math.floor(Math.random() * rest.length)] : end[0] || all[0];
      if (pick) { pick.dispatchEvent(new MouseEvent('click', { bubbles: true })); clicks++; }
    }
    setTimeout(tick, 5);
  };
  tick();
}

})();
</script>
